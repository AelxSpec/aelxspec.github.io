/* =============================================================
   ПОДСКАЗКИ: маленькое окошко у элемента вместо системного title
   ============================================================= */
const tipEl=document.createElement("div"); tipEl.id="tip"; document.body.appendChild(tipEl);
let tipFor=null,_tipT=0,tipXY=[0,0];
document.addEventListener("pointermove",e=>{tipXY=[e.clientX,e.clientY];},{passive:true});
function hideTip(){clearTimeout(_tipT);tipFor=null;tipEl.classList.remove("on");}
function showTip(el){
  if(!el.isConnected||tipFor!==el)return;
  let html="";
  if(el.dataset.tipres){const [nid,k]=el.dataset.tipres.split("|"); html=resTipHtml(nid,k);}
  else{
    const t=el.dataset.tip||"", m=t.match(/^(.*?)\s*\(([^()]{1,8})\)(.*)$/s);
    html=m?esc(m[1])+`<kbd>${esc(m[2])}</kbd>`+esc(m[3]):esc(t);
  }
  if(!html)return;
  tipEl.innerHTML=html; tipEl.classList.add("on");
  const r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.bottom+8;
  if(el.closest("#toolbar")){x=r.right+10;y=r.top+r.height/2-h/2;}
  else if(el.dataset.tipres){
    /* строки таблицы широкие: окошко держится у курсора, чтобы не закрывать соседние строки */
    x=tipXY[0]+18; y=tipXY[1]+16;
    if(x+w>innerWidth-6)x=tipXY[0]-w-18;
    if(y+h>innerHeight-6)y=Math.max(6,tipXY[1]-h-12);
  }
  if(y+h>innerHeight-6)y=r.top-h-8;
  x=Math.max(6,Math.min(innerWidth-w-6,x)); y=Math.max(6,Math.min(innerHeight-h-6,y));
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px";
}
document.addEventListener("pointerover",e=>{
  const el=e.target.closest?e.target.closest("[title],[data-tip],[data-tipres]"):null;
  if(el&&el.hasAttribute("title")){ const t=el.getAttribute("title"); if(t)el.dataset.tip=t; el.removeAttribute("title"); }
  if(el===tipFor)return;
  hideTip();
  if(!el||e.pointerType==="touch"||panState)return;
  if(!el.dataset.tip&&!el.dataset.tipres)return;
  tipFor=el; _tipT=setTimeout(()=>showTip(el),el.dataset.tipres?160:420);
});
document.addEventListener("pointerdown",hideTip,true);
document.addEventListener("keydown",hideTip,true);
document.addEventListener("wheel",hideTip,{passive:true,capture:true});

/* =============================================================
   КАРТОЧКА ПРОВИНЦИИ ПОД КУРСОРОМ
   ============================================================= */
let hoverProv=null,_hovRaf=0,_hovPt=null;
function queueHover(x,y,t){
  _hovPt=[x,y,t];
  if(_hovRaf)return;
  _hovRaf=requestAnimationFrame(()=>{
    _hovRaf=0;
    const [x,y,t]=_hovPt;
    if(!data||!layers.borders||(t&&t.closest&&t.closest("#navbox,#minimap"))){setHover(null);return;}
    let hit=null;
    for(const q of data.provinces){
      if(q.points.length<3||!canSee(q.vis,q.nationId))continue;
      const b=pbox(q); if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;
      if(ptIn(q.points,x,y)){hit=q;break;}
    }
    setHover(hit?hit.id:null);
  });
}
function setHover(id){ if(id===hoverProv)return; hoverProv=id; updateProvCard(); renderOverlayOnly(); }
function updateProvCard(){
  const el=$("#provCard"), p=hoverProv&&data?data.provinces.find(x=>x.id===hoverProv):null;
  if(!p){el.classList.remove("on");return;}
  const n=nation(p.nationId), eco=canSeeEconomy(p), cap=!!p.nationId&&eco&&econCap(p.nationId)?.id===p.id;
  const fabN=(p.stats.fabs||[]).reduce((a,f)=>a+num(f.count),0), mineN=(p.stats.mines||[]).filter(m=>+m.amt).length;
  el.style.borderLeftColor=n?n.color:"var(--line)";
  el.innerHTML=`<h4>${esc(p.name)}</h4><div class="s"><i style="background:${n?n.color:"#777"}"></i>${n?esc(n.name):"ничейная территория"}`+
    (p.stats.pop?`<br>Население: ${esc(p.stats.pop)}`:"")+
    (eco&&(fabN||mineN)?`<br>Предприятий: ${fabN} · добывающих точек: ${mineN}`:"")+
    (cap?`<br><span style="color:#e0c068">◈ столица экономики — здесь пул ресурсов</span>`:"")+
    `<br><span style="opacity:.7">клик — подробнее</span></div>`;
  el.classList.add("on");
}
vp.addEventListener("pointerleave",()=>setHover(null));

/* =============================================================
   НАВИГАЦИЯ: кнопки масштаба и миникарта
   ============================================================= */
$("#navIn").onclick=()=>zoomBy(1.6);
$("#navOut").onclick=()=>zoomBy(1/1.6);
$("#navFit").onclick=()=>zoomFit(true);
$("#navSel").onclick=()=>{ if(!focusSelection())toast("Сначала выбери объект на карте"); };
$("#navMini").onclick=()=>{layers.minimap=!layers.minimap;showMini();};
$("#navbox").addEventListener("dblclick",e=>e.stopPropagation());
const mini=$("#minimap"), mctx=mini.getContext("2d");
let miniBase=null, miniVer=-1, _miniRaf=0, miniDrag=false;
function buildMini(){
  if(!mapLoaded||!layers.minimap)return;
  const W=img.naturalWidth,H=img.naturalHeight,k=Math.min(200/W,150/H);
  mini.width=Math.max(20,Math.round(W*k)); mini.height=Math.max(20,Math.round(H*k));
  miniBase=document.createElement("canvas"); miniBase.width=mini.width; miniBase.height=mini.height;
  const g=miniBase.getContext("2d");
  try{ g.drawImage(shotBgEl("auto")||img,0,0,mini.width,mini.height); }catch(e){}
  if(data&&role){
    g.globalAlpha=0.38;
    for(const p of data.provinces){
      if(!p.nationId||p.points.length<3||!canSee(p.vis,p.nationId))continue;
      const n=nation(p.nationId); if(!n)continue;
      g.fillStyle=n.color; g.beginPath();
      p.points.forEach((q,i)=>i?g.lineTo(q[0]*k,q[1]*k):g.moveTo(q[0]*k,q[1]*k));
      g.closePath(); g.fill();
    }
    g.globalAlpha=1;
  }
  miniVer=borderVer; drawMini();
}
function drawMini(){
  if(_miniRaf||!layers.minimap||!mapLoaded)return;
  _miniRaf=requestAnimationFrame(()=>{
    _miniRaf=0;
    if(!miniBase||miniVer!==borderVer){buildMini();return;}
    const k=mini.width/img.naturalWidth, r=vp.getBoundingClientRect();
    mctx.clearRect(0,0,mini.width,mini.height); mctx.drawImage(miniBase,0,0);
    const x=-view.x/view.s*k, y=-view.y/view.s*k, w=r.width/view.s*k, h=r.height/view.s*k;
    mctx.fillStyle="rgba(201,162,90,.14)"; mctx.fillRect(x,y,w,h);
    mctx.strokeStyle="#e8d9a8"; mctx.lineWidth=1.5; mctx.strokeRect(x+.5,y+.5,Math.max(2,w-1),Math.max(2,h-1));
  });
}
function showMini(){
  mini.style.display=layers.minimap&&mapLoaded?"block":"none";
  $("#navMini").classList.toggle("primary",!!layers.minimap);
  if(layers.minimap)buildMini();
}
function miniGo(e,smooth){
  const r=mini.getBoundingClientRect(), k=img.naturalWidth/r.width;
  const x=(e.clientX-r.left)*k, y=(e.clientY-r.top)*k;
  if(smooth){flyTo(x,y,view.s,260);return;}
  fly=null; zAnim=null;
  const vr=vp.getBoundingClientRect();
  view.x=vr.width/2-x*view.s; view.y=vr.height/2-y*view.s; applyView(); setMoving(true); schedulePanRedraw();
}
mini.addEventListener("pointerdown",e=>{e.stopPropagation(); if(!mapLoaded)return; mini.setPointerCapture(e.pointerId); miniDrag=false; mini._down=[e.clientX,e.clientY];});
mini.addEventListener("pointermove",e=>{
  if(!mini._down)return;
  if(!miniDrag&&Math.abs(e.clientX-mini._down[0])+Math.abs(e.clientY-mini._down[1])>3)miniDrag=true;
  if(miniDrag)miniGo(e,false);
});
mini.addEventListener("pointerup",e=>{ if(mini._down&&!miniDrag)miniGo(e,true); if(miniDrag)render(); mini._down=null; miniDrag=false; });
mini.addEventListener("wheel",e=>{e.stopPropagation();e.preventDefault();zoomBy(e.deltaY<0?1.4:1/1.4);},{passive:false});

/* =============================================================
   ВХОД
   ============================================================= */
function applyRole(){
  /* инлайновые display больше не ставим: они и ломали вёрстку */
  document.querySelectorAll(".gm-only").forEach(el=>el.style.removeProperty("display"));
  document.body.classList.toggle("is-gm",!!role.gm);
  $("#roleBadge").textContent=role.gm?"ГМ · полный допуск":`Игрок: ${player(role.playerId)?.name||"?"}`;
}
function startApp(){
  bumpBorders(); undoStack.length=0; redoStack.length=0; markClean();
  applyRole();applyView();render();setTool("select");
  const hints=Object.entries(data.meta.underlayHints||{}).map(([k,v])=>`${MODES.find(m=>m[0]===k)?.[1]}: ${v}`).join(" · ");
  toast(role.gm?"Добро пожаловать, ГМ. На все воля твоя.":"Допуск подтверждён");
  if(hints)setTimeout(()=>toast("В партии есть подложки — подключи их через «🗺 Фоны»: "+hints),2800);
}
function loginScreen(){
  const m=openModal("",`
    <div id="login">
      <div class="stamp"><div class="frame">
        <div class="big">ВПИ</div>
        <div class="small">Штабная карта · v${APP_VER} · допуск по коду</div>
      </div></div>
      <button class="bigbtn" id="lg_new">Новая партия (ГМ)<small>Чистый стол: карта, государства, игроки — с нуля</small></button>
      <button class="bigbtn" id="lg_load">Загрузить файл партии<small>Мастер-файл ГМа или персональная сборка игрока · сохранения v1.0 совместимы</small></button>
    </div>`,[]);
  m.querySelector(".mhead").style.display="none";
  m.querySelector("#lg_new").onclick=()=>{
    data=newData();role={gm:true};m.remove();
    startApp();
    pickMap(()=>toast("Карта подключена. Настройки → игроки и государства."));
  };
  m.querySelector("#lg_load").onclick=async ()=>{
    if(typeof window.showOpenFilePicker==="function"){
      try{
        const [h]=await window.showOpenFilePicker({types:[{description:"Партия ВПИ",accept:{"application/json":[".json"]}}]});
        const f=await h.getFile(); const txt=await f.text();
        try{ data=migrate(JSON.parse(txt)); }catch(e){ toast("Файл повреждён или это не сохранение"); return; }
        fileHandle=h; m.remove(); roleSelect(); return;
      }catch(e){ if(e&&e.name==="AbortError")return; }
    }
    const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
    inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{data=migrate(JSON.parse(rd.result));}catch(e){toast("Файл повреждён или это не сохранение");return;}
        m.remove();roleSelect();
      };
      rd.readAsText(f);
    };
    inp.click();
  };
}
function roleSelect(){
  if(data.meta.lockedRole){
    const pl=player(data.meta.lockedRole);
    openModal("Допуск",`
      <div class="hint">Персональная сборка: <b style="color:var(--brass)">${esc(pl?.name||"?")}</b></div>
      <label>Код доступа</label><input id="lr_code" type="password">
    `,[["Войти","primary",()=>{
      if((pl?.code||"")!==$("#lr_code").value){toast("Код не подходит");return;}
      role={gm:false,playerId:pl.id};closeModal();startApp();pickMap();
    }]]);
    return;
  }
  openModal("Кто входит",`
    <label>Роль</label>
    <select id="lr_role">
      <option value="gm">ГМ</option>
      ${data.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
    </select>
    <label>Код доступа</label><input id="lr_code" type="password" placeholder="если задан">
  `,[["Войти","primary",()=>{
    const r=$("#lr_role").value,code=$("#lr_code").value;
    if(r==="gm"){
      if((data.meta.gmCode||"")!==code){toast("Код ГМа не подходит");return;}
      role={gm:true};
    } else {
      const pl=player(r);
      if((pl.code||"")!==code){toast("Код не подходит");return;}
      role={gm:false,playerId:r};
    }
    closeModal();startApp();pickMap();
  }]]);
}

(function(){
  try{
    const icon=document.querySelector('link[rel="icon"]')?.getAttribute("href")||"";
    const mf={name:"ВПИ · Штабная карта",short_name:"ВПИ",start_url:".",scope:".",
      display:"standalone",background_color:"#14161a",theme_color:"#1c1f26",
      icons: icon?[{src:icon,sizes:"any",type:"image/svg+xml",purpose:"any maskable"}]:[]};

    const l=document.createElement("link"); l.rel="manifest"; l.href=url;
    document.head.appendChild(l);
  }catch(e){}
})();

loginScreen();
