function renderZones(U){
  const list=(data.zones||[]);
  let defs="", body="";
  const V=viewBox();
  for(const z of list){
    if(!z.points||z.points.length<3)continue;
    if(!canSee(z.vis,z.nationId))continue;
    const bb=bboxOf(z.points);
    if(!boxHit(bb,V))continue;
    const sel=selection?.kind==="zone"&&selection.id===z.id;
    const gap=Math.max(1.2,U*(+z.gap||120)/100);
    const lw=Math.max(0.25,gap*Math.min(0.9,Math.max(0.05,(+z.thick||30)/100)));
    const pid="zh_"+z.id;
    defs+='<pattern id="'+pid+'" patternUnits="userSpaceOnUse" width="'+gap.toFixed(2)+'" height="'+gap.toFixed(2)+
      '" patternTransform="rotate('+(+z.angle||0)+')">'+
      '<line x1="0" y1="'+(-gap).toFixed(2)+'" x2="0" y2="'+(gap*2).toFixed(2)+'" stroke="'+z.color+
      '" stroke-width="'+lw.toFixed(2)+'" stroke-linecap="square"/></pattern>';
    const pts=z.points.map(q=>q.join(",")).join(" ");
    const fo=Math.max(0,Math.min(60,+z.fillOp||0))/100;
    if(fo>0) body+='<polygon points="'+pts+'" fill="'+z.color+'" fill-opacity="'+fo.toFixed(3)+'" stroke="none" style="pointer-events:none"/>';
    body+='<polygon points="'+pts+'" fill="url(#'+pid+')" stroke="none" style="pointer-events:none"/>';
    body+='<polygon data-kind="zone" data-id="'+z.id+'" points="'+pts+'" fill="none" stroke="'+z.color+
      '" stroke-opacity="'+(sel?1:0.8)+'" stroke-width="'+(U*(sel?0.5:0.3)).toFixed(2)+
      '" stroke-linejoin="round" style="cursor:pointer" pointer-events="stroke"/>';
    if(z.showLabel!==false && z.name){
      const c=centroid(z.points), F=U*2.0*Math.max(0.2,(+z.labelSize||100)/100);
      body+='<text x="'+c[0].toFixed(0)+'" y="'+c[1].toFixed(0)+'" font-size="'+F.toFixed(1)+
        '" text-anchor="middle" dominant-baseline="middle" fill="'+z.color+
        '" stroke="#0d0f12" stroke-width="'+(F*0.16).toFixed(2)+'" paint-order="stroke" letter-spacing="'+(F*0.06).toFixed(2)+
        '" style="pointer-events:none;font-family:Georgia,serif;text-transform:uppercase">'+esc(z.name)+'</text>';
    }
  }
  /* набросок контура рисуется всегда */
  if(zoneDraft&&zoneDraft.length){
    const W=U*0.42, col=window.__zoneColor||"#c9a25a";
    if(zoneDraft.length>1)
      body+='<polyline points="'+zoneDraft.map(q=>q.join(",")).join(" ")+'" fill="'+col+'" fill-opacity="0.12" '+
        'stroke="#0f1113" stroke-width="'+(W*2).toFixed(2)+'" stroke-linejoin="round" style="pointer-events:none"/>'+
        '<polyline points="'+zoneDraft.map(q=>q.join(",")).join(" ")+'" fill="none" stroke="'+col+'" '+
        'stroke-width="'+W.toFixed(2)+'" stroke-dasharray="'+(U*1.5).toFixed(2)+' '+(U*0.9).toFixed(2)+'" stroke-linejoin="round" style="pointer-events:none"/>';
    for(const q of zoneDraft)
      body+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(U*0.8).toFixed(2)+'" fill="'+col+
        '" stroke="#0f1113" stroke-width="'+(U*0.2).toFixed(2)+'" style="pointer-events:none"/>';
  }
  return (defs?'<defs>'+defs+'</defs>':"")+body;
}

/* =============================================================
   СТРЕЛКИ С ПОДПИСЯМИ
   ============================================================= */
function arrowPath(pts,curve){
  if(pts.length<2) return "";
  if(!curve||pts.length===2) return pts.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ");
  let d="M"+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    d+=" Q"+pts[i][0]+" "+pts[i][1]+" "+mx.toFixed(1)+" "+my.toFixed(1);
  }
  const L=pts[pts.length-1];
  d+=" L"+L[0]+" "+L[1];
  return d;
}
function arrowHeadPoly(tip,from,W){
  const dx=tip[0]-from[0], dy=tip[1]-from[1], L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const hl=W*3.4, hw=W*2.0;
  const bx=tip[0]-ux*hl, by=tip[1]-uy*hl;
  return `${tip[0]},${tip[1]} ${(bx+px*hw).toFixed(1)},${(by+py*hw).toFixed(1)} ${(bx-px*hw).toFixed(1)},${(by-py*hw).toFixed(1)}`;
}
function renderArrows(U){
  let out="";
  const V=viewBox();
  const one=(a,pts,sel,id)=>{
    const W=Math.max(0.5,U*0.30*(a.width||100)/100);
    const col=sel?"#e8d9a8":(a.color||"#c9a25a");
    const d=arrowPath(pts,a.curve);
    let dash="";
    if(a.style==="dash")dash=` stroke-dasharray="${(W*4.5).toFixed(1)} ${(W*2.8).toFixed(1)}"`;
    if(a.style==="dot") dash=` stroke-dasharray="${(W*1.1).toFixed(1)} ${(W*2.2).toFixed(1)}"`;
    let g=`<g data-kind="arrow" data-id="${id||""}" style="cursor:pointer">`;
    g+=`<path d="${d}" fill="none" stroke="#0f1113" stroke-opacity="0.8" stroke-width="${(W*2.3).toFixed(1)}" stroke-linejoin="round" stroke-linecap="round"/>`;
    g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${W.toFixed(1)}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
    if(a.head==="end"||a.head==="both"){
      const p=arrowHeadPoly(pts[pts.length-1],pts[pts.length-2],W);
      g+=`<polygon points="${p}" fill="${col}" stroke="#0f1113" stroke-width="${(W*0.35).toFixed(2)}" stroke-linejoin="round"/>`;
    }
    if(a.head==="both"){
      const p=arrowHeadPoly(pts[0],pts[1],W);
      g+=`<polygon points="${p}" fill="${col}" stroke="#0f1113" stroke-width="${(W*0.35).toFixed(2)}" stroke-linejoin="round"/>`;
    }
    if(a.showLabel!==false&&a.name){
      const i=Math.floor((pts.length-1)/2);
      const p0=pts[i], p1=pts[i+1]||pts[i];
      const cx=(p0[0]+p1[0])/2, cy=(p0[1]+p1[1])/2;
      const dx=p1[0]-p0[0], dy=p1[1]-p0[1], L=Math.hypot(dx,dy)||1;
      const off=W*2.6;
      const F=U*1.15*Math.max(0.2,(a.labelSize||100)/100);
      g+=`<text x="${(cx-(-dy/L)*off).toFixed(0)}" y="${(cy-(dx/L)*off).toFixed(0)}" font-size="${F.toFixed(1)}"
        text-anchor="middle" dominant-baseline="middle" fill="${col}" stroke="#0d0f12"
        stroke-width="${(F*0.17).toFixed(2)}" paint-order="stroke"
        style="pointer-events:none;font-family:Georgia,serif">${esc(a.name)}</text>`;
    }
    return g+"</g>";
  };
  for(const a of (data.arrows||[])){
    if(!canSee(a.vis,a.nationId))continue;
    if(_shotOn&&a.noShot)continue;
    if(!a.pts||a.pts.length<2||!boxHit(bboxOf(a.pts),V))continue;
    out+=one(a,a.pts,selection?.kind==="arrow"&&selection.id===a.id,a.id);
  }
  if(arrowDraft&&arrowDraft.length){
    const W=Math.max(0.5,U*0.30);
    if(arrowDraft.length>1)
      out+=one({color:"#c9a25a",width:100,style:"solid",head:"end",curve:true,showLabel:false},arrowDraft,true,"");
    for(const q of arrowDraft)
      out+=`<circle cx="${q[0]}" cy="${q[1]}" r="${(W*1.5).toFixed(1)}" fill="#c9a25a" stroke="#0f1113" stroke-width="${(W*0.4).toFixed(2)}" style="pointer-events:none"/>`;
  }
  return out;
}

function renderWar(U){
  let out="";
  /* набросок рисуется всегда, даже когда ни одного театра ещё не создано */
  if(theatreDraft&&theatreDraft.length){
    const W=U*0.5;
    if(theatreDraft.length>1)
      out+='<polyline points="'+theatreDraft.map(q=>q.join(",")).join(" ")+'" fill="rgba(201,162,90,.14)" '+
        'stroke="#0f1113" stroke-width="'+(W*2.1)+'" stroke-linejoin="round" style="pointer-events:none"/>'+
        '<polyline points="'+theatreDraft.map(q=>q.join(",")).join(" ")+'" fill="none" stroke="#e8d9a8" '+
        'stroke-width="'+W+'" stroke-dasharray="'+(U*1.6)+' '+(U*1.0)+'" stroke-linejoin="round" style="pointer-events:none"/>';
    for(const q of theatreDraft)
      out+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(U*0.9).toFixed(1)+'" fill="#e8d9a8" stroke="#0f1113" stroke-width="'+(U*0.22)+'" style="pointer-events:none"/>';
  }
  if(!layers.war||!data.theatres||!data.theatres.length) return out;
  const V=viewBox();
  for(const th of data.theatres){
    if(!th.points||th.points.length<3) continue;
    if(!canSee(th.vis,null)) continue;
    const bb=bboxOf(th.points);
    if(!boxHit(bb,V)) continue;
    const colA=nation(th.sideA[0])?.color||"#c0504d";
    const colB=nation(th.sideB[0])?.color||"#4d74c0";
    const sel=selection&&selection.kind==="theatre"&&selection.id===th.id;
    const pts=th.points.map(q=>q.join(",")).join(" ");
    out+='<polygon points="'+pts+'" fill="none" stroke="#0f1113" stroke-opacity="0.7" stroke-width="'+(U*(sel?0.9:0.66))+
      '" stroke-dasharray="'+(U*1.8)+' '+(U*1.2)+'" style="pointer-events:none"/>';
    out+='<polygon data-kind="theatre" data-id="'+th.id+'" points="'+pts+'" fill="none" '+
      'stroke="'+(sel?"#e8d9a8":"#c9a25a")+'" stroke-opacity="'+(sel?1:0.85)+'" stroke-width="'+(U*(sel?0.55:0.4))+
      '" stroke-dasharray="'+(U*1.8)+' '+(U*1.2)+'" style="cursor:pointer" pointer-events="stroke"/>';
    const f=computeFront(th);
    if(layers.control){
      const R=Math.max(bb[2]-bb[0],bb[3]-bb[1])/13;
      for(const u of unitsInTheatre(th)){
        const c=sideOf(th,u.nationId)>0?colA:colB;
        out+='<circle cx="'+u.x+'" cy="'+u.y+'" r="'+(R*Math.min(1.6,Math.max(0.6,unitWeight(u)))).toFixed(0)+
          '" fill="'+c+'" fill-opacity="0.07" stroke="none" style="pointer-events:none"/>';
      }
    }
    if(f.segs.length){
      let d1="";
      for(const g of f.segs) d1+='M'+g[0].toFixed(1)+' '+g[1].toFixed(1)+'L'+g[2].toFixed(1)+' '+g[3].toFixed(1);
      out+='<path d="'+d1+'" stroke="#0f1113" stroke-opacity="0.85" stroke-width="'+(U*0.75)+'" stroke-linecap="round" fill="none" style="pointer-events:none"/>';
      out+='<path d="'+d1+'" stroke="#e8d9a8" stroke-width="'+(U*0.34)+'" stroke-linecap="round" fill="none" style="pointer-events:none"/>';
      let k=0;
      for(const g of f.segs){
        if((k++)%3) continue;
        const mx=(g[0]+g[2])/2,my=(g[1]+g[3])/2;
        const dx=g[2]-g[0],dy=g[3]-g[1],L=Math.hypot(dx,dy)||1;
        const nx=-dy/L,ny=dx/L,T=U*0.85;
        out+='<path d="M'+mx.toFixed(1)+' '+my.toFixed(1)+'L'+(mx+nx*T).toFixed(1)+' '+(my+ny*T).toFixed(1)+
          '" stroke="'+colA+'" stroke-width="'+(U*0.22)+'" fill="none" style="pointer-events:none"/>';
        out+='<path d="M'+mx.toFixed(1)+' '+my.toFixed(1)+'L'+(mx-nx*T).toFixed(1)+' '+(my-ny*T).toFixed(1)+
          '" stroke="'+colB+'" stroke-width="'+(U*0.22)+'" fill="none" style="pointer-events:none"/>';
      }
    }
    for(const h of f.hot){
      const R=U*2.4;
      out+='<g style="pointer-events:none"><circle cx="'+h.x.toFixed(0)+'" cy="'+h.y.toFixed(0)+'" r="'+R.toFixed(0)+
        '" fill="none" stroke="#b8503f" stroke-width="'+(U*0.26)+'" stroke-dasharray="'+(U*0.7)+' '+(U*0.5)+'"/>'+
        '<text x="'+h.x.toFixed(0)+'" y="'+(h.y+R*0.45).toFixed(0)+'" font-size="'+(R*1.1).toFixed(0)+
        '" text-anchor="middle" fill="#b8503f">!</text></g>';
    }
    for(const pk of f.pockets){
      const x0=pk.box[0],y0=pk.box[1],x1=pk.box[2],y1=pk.box[3],pad=U*1.2;
      out+='<text x="'+((x0+x1)/2).toFixed(0)+'" y="'+(y0-pad-U*0.6).toFixed(0)+'" font-size="'+(U*1.9).toFixed(0)+
        '" text-anchor="middle" fill="#d8b45a" stroke="#111" stroke-width="'+(U*0.2)+
        '" paint-order="stroke" style="pointer-events:none">котёл · '+pk.units+' соед.</text>';
    }
    out+='<text x="'+((bb[0]+bb[2])/2).toFixed(0)+'" y="'+(bb[1]-U*1.2).toFixed(0)+'" font-size="'+(U*2.4).toFixed(0)+
      '" text-anchor="middle" fill="#c9a25a" stroke="#0d0f12" stroke-width="'+(U*0.25)+
      '" paint-order="stroke" style="pointer-events:none;font-family:Georgia,serif;text-transform:uppercase">'+esc(th.name)+'</text>';
  }
  return out;
}

/* ---- ОВЕРЛЕЙ: только то, что меняется без правки данных ---- */
function drawOverlay(){
  if(!data){svg2.innerHTML="";return;}
  const U=Math.max(3,(img.naturalWidth||4000)/420);
  const sw=2/view.s;
  let o="";
  /* радиусы построек */
  if(layers.structures)for(const st0 of data.structures){
    if(!canSee(st0.vis,st0.nationId))continue;
    const active = layers.radii || hoverStruct===st0.id || (selection?.kind==="structure"&&selection.id===st0.id);
    if(!active)continue;
    const st=STRUCT_TYPES.find(t=>t[0]===st0.type)||STRUCT_TYPES[0];
    o+=`<circle cx="${st0.x}" cy="${st0.y}" r="${st0.radius}" fill="${st[4]}" fill-opacity="0.07"
      stroke="${st[4]}" stroke-opacity="0.85" stroke-width="${sw*1.4}" stroke-dasharray="${sw*5} ${sw*4}"/>`;
  }
  /* провинция под курсором: светлая обводка поверх границ */
  if(hoverProv&&layers.borders&&!panState){
    const p=data.provinces.find(x=>x.id===hoverProv);
    if(p&&p.points.length>2&&canSee(p.vis,p.nationId)){
      const pts=simplify(p.points,0.5/view.s).map(q=>q.join(",")).join(" ");
      o+=`<polygon points="${pts}" fill="#e8d9a8" fill-opacity="0.07" stroke="#0f1113" stroke-opacity="0.55" stroke-width="${sw*4.2}" stroke-linejoin="round"/>`+
         `<polygon points="${pts}" fill="none" stroke="#f3e6b8" stroke-width="${sw*1.8}" stroke-linejoin="round"/>`;
    }
  }
  /* рисуемый контур провинции */
  if(drawing&&drawing.length){
    o+=`<polyline points="${drawing.map(q=>q.join(",")).join(" ")}" fill="rgba(201,162,90,.15)"
      stroke="#c9a25a" stroke-width="${sw}" stroke-dasharray="${sw*3} ${sw*2}"/>`;
    for(const pt of drawing)o+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="${sw*2.4}" fill="#c9a25a"/>`;
  }
  if(band){
    const X0=Math.min(band.x0,band.x1),Y0=Math.min(band.y0,band.y1);
    o+=`<rect x="${X0}" y="${Y0}" width="${Math.abs(band.x1-band.x0)}" height="${Math.abs(band.y1-band.y0)}"
      fill="#c9a25a" fill-opacity="0.08" stroke="#c9a25a" stroke-width="${sw*1.2}" stroke-dasharray="${sw*3} ${sw*2}"/>`;
  }
  if(ruler&&ruler.a){
    const U=Math.max(3,(img.naturalWidth||4000)/420);
    const b2=ruler.b||[_cx,_cy];
    const L=Math.hypot(b2[0]-ruler.a[0],b2[1]-ruler.a[1]);
    o+=`<line x1="${ruler.a[0]}" y1="${ruler.a[1]}" x2="${b2[0]}" y2="${b2[1]}" stroke="#e8d9a8" stroke-width="${sw*1.4}" stroke-dasharray="${sw*4} ${sw*3}"/>`;
    for(const q of [ruler.a,b2]) o+=`<circle cx="${q[0]}" cy="${q[1]}" r="${sw*2.4}" fill="#e8d9a8"/>`;
    const mx=(ruler.a[0]+b2[0])/2, my=(ruler.a[1]+b2[1])/2;
    o+=`<text x="${mx}" y="${my-sw*4}" font-size="${U*2.2}" text-anchor="middle" fill="#e8d9a8" stroke="#111" stroke-width="${U*0.25}" paint-order="stroke">${Math.round(L)} px</text>`;
  }
  /* легенда штриховых областей: держится в углу экрана, удобна для скриншотов */
  if(layers.legend&&data.zones&&data.zones.length){
    const seen=new Map();
    for(const z of data.zones){
      if(!canSee(z.vis,z.nationId))continue;
      if(!z.points||z.points.length<3)continue;
      const k=z.color+"|"+(z.name||"");
      if(!seen.has(k))seen.set(k,z);
    }
    const items=[...seen.values()];
    if(items.length){
      const K=1/view.s, pad=11*K, fs=13*K, lh=fs*1.6, bw=fs*1.7;
      const x0=-view.x*K+pad, y0=-view.y*K+pad;
      let wmax=6; for(const z of items) wmax=Math.max(wmax,String(z.name||"").length);
      const W=bw+fs*0.6+wmax*fs*0.56+pad*1.6, H=items.length*lh+pad*1.2;
      o+='<g style="pointer-events:none">';
      o+='<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+W.toFixed(1)+'" height="'+H.toFixed(1)+
        '" fill="#14161a" fill-opacity="0.85" stroke="#8a7340" stroke-width="'+(1.3*K).toFixed(2)+'"/>';
      items.forEach((z,i)=>{
        const yy=y0+pad*0.6+i*lh;
        o+='<rect x="'+(x0+pad*0.7).toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+fs.toFixed(1)+
          '" fill="'+z.color+'" fill-opacity="0.4" stroke="'+z.color+'" stroke-width="'+(1*K).toFixed(2)+'"/>';
        o+='<text x="'+(x0+pad*0.7+bw+fs*0.55).toFixed(1)+'" y="'+(yy+fs*0.82).toFixed(1)+'" font-size="'+fs.toFixed(1)+
          '" fill="#e8e4d8" style="font-family:Georgia,serif">'+esc(z.name||"")+'</text>';
      });
      o+='</g>';
    }
  }
  svg2.innerHTML=o;
  /* ручки вершин живут в основном слое: они кликабельны */
  const old=svg.querySelector("#vhandles"); if(old)old.remove();
  if(role?.gm&&selection?.kind==="province"){
    const p=data.provinces.find(x=>x.id===selection.id);
    if(p){
      let h='<g id="vhandles">';
      p.points.forEach((pt,i)=>{h+=`<circle data-vertex="${i}" cx="${pt[0]}" cy="${pt[1]}" r="${sw*3}" fill="#e8d9a8" stroke="#111" stroke-width="${sw*0.6}" style="cursor:move"/>`;});
      svg.insertAdjacentHTML("beforeend",h+"</g>");
    }
  }
}


/* =============================================================
   МЕХАНИКА ВОЙНЫ
   Линия фронта считается как нулевая изолиния поля влияния:
   каждое соединение "давит" на местность с силой, убывающей
   с расстоянием; там, где давление сторон равно, проходит фронт.
   ============================================================= */
let warCache=new Map(), warVer=0;
function bumpWar(){ warVer++; warCache.clear(); }

function unitWeight(u){
  const m=num(u.eq?.men)||0;
  let w = m? m/10000 : 1;
  if(u.type==="art") w*=1.15;          /* артиллерия держит полосу шире */
  if(u.type==="mil") w*=0.6;
  if(u.type==="cav") w*=0.9;
  if(u.type==="tank") w*=1.3;
  const t=TRAINING.indexOf(u.training||"средняя");
  if(t>=0) w*=0.75+0.09*t;             /* обученность влияет на плотность */
  return Math.max(0.15,w);
}
function sideOf(th,nid){
  if(!nid)return 0;
  if(th.sideA.includes(nid))return 1;
  if(th.sideB.includes(nid))return -1;
  return 0;
}
function unitsInTheatre(th){
  if(th.points.length<3)return [];
  const b=bboxOf(th.points);
  return data.divisions.filter(u=>{
    if(u.type==="fleet")return false;
    if(!sideOf(th,u.nationId))return false;
    if(u.x<b[0]||u.x>b[2]||u.y<b[1]||u.y>b[3])return false;
    return ptIn(th.points,u.x,u.y);
  });
}
/* сигнатура: пересчитываем фронт только когда что-то реально сдвинулось */
function warSig(th){
  const us=unitsInTheatre(th);
  let s=th.id+"|"+th.points.length+"|"+th.sideA.join()+"|"+th.sideB.join()+"|";
  for(const u of us) s+=u.id+","+u.x+","+u.y+","+(u.eq?.men||"")+","+u.type+";";
  return s;
}

function computeFront(th){
  const sig=warSig(th), hit=warCache.get(th.id);
  if(hit&&hit.sig===sig) return hit.res;
  const res={segs:[],length:0,A:{n:0,men:0,w:0},B:{n:0,men:0,w:0},hot:[],pockets:[],cells:null,grid:null};
  const us=unitsInTheatre(th);
  for(const u of us){
    const t=sideOf(th,u.nationId)>0?res.A:res.B;
    t.n++; t.men+=num(u.eq?.men); t.w+=unitWeight(u);
  }
  if(!us.length||!res.A.n||!res.B.n){ warCache.set(th.id,{sig,res}); return res; }

  const b=bboxOf(th.points);
  const W=b[2]-b[0], H=b[3]-b[1];
  const NX=Math.max(24,Math.min(150,Math.round(140*W/Math.max(W,H))));
  const NY=Math.max(24,Math.min(150,Math.round(140*H/Math.max(W,H))));
  const dx=W/NX, dy=H/NY;
  const R0=Math.pow(Math.max(W,H)/26,2);      /* радиус влияния соединения */
  const F=new Float32Array((NX+1)*(NY+1));
  const IN=new Uint8Array((NX+1)*(NY+1));
  for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){
    const x=b[0]+i*dx, y=b[1]+j*dy, k=j*(NX+1)+i;
    IN[k]=ptIn(th.points,x,y)?1:0;
    if(!IN[k])continue;
    let v=0;
    for(const u of us){
      const d2=(u.x-x)*(u.x-x)+(u.y-y)*(u.y-y);
      v += sideOf(th,u.nationId)*unitWeight(u)/(d2+R0);
    }
    F[k]=v;
  }
  /* --- марширующие квадраты: нулевая изолиния --- */
  const at=(i,j)=>F[j*(NX+1)+i], inside=(i,j)=>IN[j*(NX+1)+i];
  const ip=(x1,y1,v1,x2,y2,v2)=>{const t=v1/(v1-v2);return [x1+(x2-x1)*t,y1+(y2-y1)*t];};
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    if(!(inside(i,j)&&inside(i+1,j)&&inside(i,j+1)&&inside(i+1,j+1)))continue;
    const x0=b[0]+i*dx, y0=b[1]+j*dy, x1=x0+dx, y1=y0+dy;
    const v00=at(i,j), v10=at(i+1,j), v11=at(i+1,j+1), v01=at(i,j+1);
    let code=(v00>0?1:0)|(v10>0?2:0)|(v11>0?4:0)|(v01>0?8:0);
    if(code===0||code===15)continue;
    const E={
      b:()=>ip(x0,y0,v00,x1,y0,v10), r:()=>ip(x1,y0,v10,x1,y1,v11),
      t:()=>ip(x1,y1,v11,x0,y1,v01), l:()=>ip(x0,y1,v01,x0,y0,v00)
    };
    const P={1:["b","l"],2:["b","r"],3:["l","r"],4:["r","t"],6:["b","t"],7:["l","t"],
             8:["l","t"],9:["b","t"],11:["r","t"],12:["l","r"],13:["b","r"],14:["b","l"]};
    let pairs=[];
    if(code===5) pairs=[["b","l"],["r","t"]];
    else if(code===10) pairs=[["b","r"],["l","t"]];
    else if(P[code]) pairs=[P[code]];
    for(const [a,c] of pairs){
      const p1=E[a](), p2=E[c]();
      res.segs.push([p1[0],p1[1],p2[0],p2[1]]);
      res.length+=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    }
  }
  /* --- горячие участки: где перевес одной стороны наибольший --- */
  const probe=[];
  for(const sg of res.segs){
    const mx=(sg[0]+sg[2])/2, my=(sg[1]+sg[3])/2;
    let a=0,bb=0;
    for(const u of us){
      const d2=(u.x-mx)*(u.x-mx)+(u.y-my)*(u.y-my);
      const w=unitWeight(u)/(d2+R0);
      if(sideOf(th,u.nationId)>0)a+=w; else bb+=w;
    }
    const tot=a+bb; if(tot<=0)continue;
    probe.push({x:mx,y:my,ratio:Math.max(a,bb)/Math.min(a,bb||1e-9),dens:tot,side:a>bb?1:-1});
  }
  probe.sort((p,q)=>q.ratio-p.ratio);
  const minGap=Math.max(W,H)/9;
  for(const pr of probe){
    if(pr.ratio<1.6)break;
    if(res.hot.some(h=>Math.hypot(h.x-pr.x,h.y-pr.y)<minGap))continue;
    res.hot.push(pr); if(res.hot.length>=4)break;
  }
  /* --- котлы: область одного знака, не касающаяся края театра --- */
  const lab=new Int16Array((NX+1)*(NY+1)).fill(-1);
  let comp=0; const info=[];
  for(let j=0;j<=NY;j++)for(let i=0;i<=NX;i++){
    const k=j*(NX+1)+i;
    if(!IN[k]||lab[k]>=0)continue;
    const sgn=F[k]>0?1:-1, st=[k]; lab[k]=comp;
    let touch=false, cells=0, minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    while(st.length){
      const c=st.pop(), ci=c%(NX+1), cj=(c-ci)/(NX+1); cells++;
      const cx=b[0]+ci*dx, cy=b[1]+cj*dy;
      minx=Math.min(minx,cx);maxx=Math.max(maxx,cx);miny=Math.min(miny,cy);maxy=Math.max(maxy,cy);
      for(const [ni,nj] of [[ci-1,cj],[ci+1,cj],[ci,cj-1],[ci,cj+1]]){
        if(ni<0||nj<0||ni>NX||nj>NY){touch=true;continue;}
        const nk=nj*(NX+1)+ni;
        if(!IN[nk]){touch=true;continue;}
        if(lab[nk]>=0)continue;
        if((F[nk]>0?1:-1)!==sgn)continue;
        lab[nk]=comp; st.push(nk);
      }
    }
    info.push({comp,sgn,cells,touch,box:[minx,miny,maxx,maxy]});
    comp++;
  }
  const total=info.reduce((a,c)=>a+c.cells,0)||1;
  for(const c of info){
    if(c.touch||c.cells/total>0.25||c.cells<6)continue;
    const inPocket=us.filter(u=>sideOf(th,u.nationId)===c.sgn&&
      u.x>=c.box[0]-dx&&u.x<=c.box[2]+dx&&u.y>=c.box[1]-dy&&u.y<=c.box[3]+dy);
    if(!inPocket.length)continue;
    res.pockets.push({side:c.sgn,box:c.box,units:inPocket.length,
      men:inPocket.reduce((a,u)=>a+num(u.eq?.men),0)});
  }
  warCache.set(th.id,{sig,res});
  return res;
}

/* =============================================================
   ИНСПЕКТОР
   ============================================================= */
function select(kind,id){selection={kind,id};render();renderInspector();}
function closeInspector(){$("#inspector").classList.add("hidden");selection=null;render();}

function visSelector(cur,name,allowOwner){
  const isList=Array.isArray(cur);
  let h=`<label>Кто видит</label><select id="${name}" onchange="fieldChanged()">
    <option value="all" ${cur==='all'?'selected':''}>Все</option>
    <option value="gm" ${cur==='gm'?'selected':''}>Только ГМ</option>
    ${allowOwner?`<option value="owner" ${cur==='owner'?'selected':''}>ГМ + владелец</option>`:""}
    <option value="list" ${isList?'selected':''}>Выбранные игроки</option>
  </select><div id="${name}_list" style="${isList?'':'display:none'};margin-top:5px">`;
  for(const p of data.players)
    h+=`<div class="checkrow"><input type="checkbox" data-vl="${name}" value="${p.id}" ${isList&&cur.includes(p.id)?'checked':''} onchange="fieldChanged()"> ${esc(p.name)}</div>`;
  h+=`</div>`;
  return h;
}
function readVis(name){
  const v=$("#"+name).value;
  if(v!=="list")return v;
  return [...document.querySelectorAll(`input[data-vl="${name}"]:checked`)].map(i=>i.value);
}
window.fieldChanged=()=>{
  if(!selection)return;
  markDirty(); snapshot();
  const s=selection;
  if(!role.gm){ /* игрок правит только оснащение своих соединений */
    if(s.kind==="division"){
      const d=data.divisions.find(x=>x.id===s.id);
      if(d&&canMoveDivision(d)){ writeEq(d); writeShips(d); }
    }
    return;
  }
  if(s.kind==="province"){
    const p=data.provinces.find(x=>x.id===s.id);if(!p)return;
    p.name=$("#f_name").value;
    const natChanged=p.nationId!==($("#f_nation").value||null);
    if(natChanged)bumpBorders();
    p.nationId=$("#f_nation").value||null;
    p.stats.pop=$("#f_pop").value;p.stats.fab=$("#f_fab").value;p.stats.notes=$("#f_notes").value;
    document.querySelectorAll("[data-fab]").forEach(i=>{const f=(p.stats.fabs||[]).find(x=>x.type===i.dataset.fab); if(f)f.count=String(Math.max(0,Math.round(+i.value||0)));});
    document.querySelectorAll("[data-mn]").forEach(i=>{
      const m=(p.stats.mines||[]).find(x=>x.id===i.dataset.mn); if(!m)return;
      m.name=i.value; m.res=$(`[data-mr="${m.id}"]`).value; m.amt=Math.max(0,+$(`[data-ma="${m.id}"]`).value||0);
    });
    p.secret=$("#f_secret").value;
    p.secretVis=[...document.querySelectorAll('input[data-sv]:checked')].map(i=>i.value);
    p.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
    if(natChanged){render();reIns();return;}
    refreshInsPool(p);
  }
  if(s.kind==="city"){
    const c=data.cities.find(x=>x.id===s.id);if(!c)return;
    c.name=$("#f_name").value;c.size=$("#f_size").value;c.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="division"){
    const d=data.divisions.find(x=>x.id===s.id);if(!d)return;
    d.name=$("#f_name").value;d.nationId=$("#f_nation").value||null;d.type=$("#f_type").value;
    d.training=$("#f_train").value;d.quality=$("#f_qual").value;d.strength=$("#f_str").value;
    if($("#f_dshot"))d.noShot=$("#f_dshot").checked;
    d.vis=readVis("f_vis");
    writeEq(d); writeShips(d);
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="theatre"){
    const th=data.theatres.find(x=>x.id===s.id);if(!th)return;
    th.name=$("#f_name").value; th.note=$("#f_tnote").value;
    th.sideA=[...document.querySelectorAll('input[data-sa]:checked')].map(i=>i.value);
    th.sideB=[...document.querySelectorAll('input[data-sb]:checked')].map(i=>i.value)
              .filter(x=>!th.sideA.includes(x));
    th.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
    bumpWar();
    clearTimeout(window.__thRefresh);
    window.__thRefresh=setTimeout(()=>{ if(selection&&selection.kind==="theatre")renderInspector(); },600);
  }
  if(s.kind==="deposit"){
    const dp=data.deposits.find(x=>x.id===s.id);if(!dp)return;
    dp.name=$("#f_name").value;dp.type=$("#f_dtype").value;dp.size=$("#f_dsize").value;
    dp.nationId=$("#f_dnat").value||null;
    dp.output=$("#f_dout").value;dp.notes=$("#f_dnotes").value;dp.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="rail"){
    const r=data.rails.find(x=>x.id===s.id);if(!r)return;
    r.name=$("#f_name").value;r.nationId=$("#f_nation").value||null;r.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="arrow"){
    const a=data.arrows.find(x=>x.id===s.id);if(!a)return;
    a.name=$("#f_name").value; a.color=$("#f_acol").value;
    a.width=Math.max(20,+$("#f_awid").value||100);
    a.style=$("#f_asty").value; a.head=$("#f_ahead").value;
    a.curve=$("#f_acur").checked; a.showLabel=$("#f_alab").checked;
    a.labelSize=Math.max(20,+$("#f_alsz").value||100);
    a.nationId=$("#f_anat").value||null; a.note=$("#f_anote").value;
    a.noShot=$("#f_ashot").checked; a.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="road"){
    const r=data.roads.find(x=>x.id===s.id);if(!r)return;
    r.name=$("#f_name").value; r.cls=$("#f_rcls").value; r.color=$("#f_rcol").value;
    r.nationId=$("#f_nation").value||null; r.note=$("#f_rnote").value; r.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="zone"){
    const z=data.zones.find(x=>x.id===s.id);if(!z)return;
    z.name=$("#f_name").value; z.color=$("#f_zcol").value;
    z.angle=+$("#f_zang").value||0; z.gap=Math.max(20,+$("#f_zgap").value||120);
    z.thick=Math.max(5,Math.min(90,+$("#f_zthk").value||30));
    z.fillOp=Math.max(0,Math.min(60,+$("#f_zfill").value||0));
    z.showLabel=$("#f_zlab").checked; z.labelSize=Math.max(20,+$("#f_zlsz").value||100);
    z.nationId=$("#f_znat").value||null; z.note=$("#f_znote").value; z.vis=readVis("f_vis");
    $("#f_vis_list").style.display=$("#f_vis").value==="list"?"":"none";
  }
  if(s.kind==="structure"){
    const st=data.structures.find(x=>x.id===s.id);if(!st)return;
    st.name=$("#f_name").value;st.nationId=$("#f_nation").value||null;
    const oldT=st.type, newT=$("#f_stype").value;
    if(oldT!==newT && +$("#f_radius").value===(data.meta.defRadius?.[oldT]||0)){
      st.radius=data.meta.defRadius?.[newT]||st.radius; $("#f_radius").value=st.radius;
    }
    st.type=newT;
    st.radius=Math.max(0,+$("#f_radius").value||0);st.notes=$("#f_snotes").value;st.vis=readVis("f_vis");
    st.planes=st.planes||{};

function writeEq(d){
  d.eq=d.eq||{};
  document.querySelectorAll("[data-eq]").forEach(i=>{
    const k=i.dataset.eq, cap=divCap(d,k), v=i.value.trim();
    if(!v){delete d.eq[k];return;}

  });
}

function resOptions(cur){
  return `<optgroup label="Сырьё">${RAW_RES.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${resName(k)}</option>`).join("")}</optgroup>`+
    `<optgroup label="Прочее">${ECON_RES.filter(r=>!RAW_RES.includes(r[0])).map(r=>`<option value="${r[0]}" ${cur===r[0]?'selected':''}>${r[1]}</option>`).join("")}</optgroup>`;
}
function provDeposits(p){
  const b=pbox(p);
  return (data.deposits||[]).filter(d=>d.x>=b[0]&&d.x<=b[2]&&d.y>=b[1]&&d.y<=b[3]&&ptIn(p.points,d.x,d.y)&&canSee(d.vis,d.nationId));
}

function setTool(t){
  tool=t;
  document.querySelectorAll(".tool[data-tool]").forEach(el=>el.classList.toggle("active",el.dataset.tool===t));
  vp.classList.toggle("drawing",t!=="select");
  $("#stTool").textContent={select:"выбор",province:"провинция",city:"город",division:"дивизия",structure:"постройка",deposit:"месторождение",rail:"железная дорога",road:"дорога",zone:"штриховая область",arrow:"стрелка",band:"рамка",theatre:"театр",ruler:"линейка"}[t]||t;
  $("#stHint").textContent=(t==="province"||t==="zone")?"клик — точка · Enter — замкнуть · Backspace — убрать · Esc — отмена":
    (t==="road"||t==="rail"||t==="arrow")?"клик — точка · Enter — закончить · Backspace — убрать · Esc — отмена":
    t==="band"?"протяни рамку по карте — свойства применятся ко всему, что в неё попало":
    t==="city"||t==="division"||t==="structure"?"клик по карте — поставить":"";
}
document.querySelectorAll(".tool[data-tool]").forEach(el=>el.addEventListener("click",()=>setTool(el.dataset.tool)));
$("#zoomFit").addEventListener("click",zoomFit);

function updateBackgrounds(){
  const mode=$("#mapMode").value;
  document.querySelectorAll("#world img.under").forEach(el=>{
    el.style.display = el.dataset.mode===mode ? "block" : "none";
  });
  img.style.visibility = underlays[mode] ? "hidden" : "visible";
}
$("#mapMode").addEventListener("change",()=>{updateBackgrounds();render();});

$("#btnLayers").addEventListener("click",()=>{
  openModal("Слои карты",`
    ${[["borders","Границы и заливка стран"],["cities","Города"],["divisions","Соединения"],["structures","Постройки"],["deposits","Месторождения"],["rails","Железные дороги"],["roads","Дороги"],["zones","Штриховые области"],["arrows","Стрелки"],["legend","Легенда областей в углу"],["radii","Радиусы построек (все сразу)"],["labels","Подписи"],["countryNames","Названия стран при отдалении"],["hideFar","Прятать значки при отдалении"],["snap","Прилипание вершин к соседям"],["autoWeld","Сшивать границы автоматически"],["war","Линия фронта и театры"],["control","Заливка зон контроля"],["edgeScroll","Прокрутка карты у края экрана"],["minimap","Миникарта в углу (N)"]]
      .map(([k,n])=>`<div class="checkrow"><input type="checkbox" id="ly_${k}" ${layers[k]?'checked':''}> ${n}</div>`).join("")}
    <h3 class="sec">Подписи соединений</h3>
    <div class="hint" style="margin-top:0">Отметь державы, чьи соединения показывать без названий - значки останутся, подписи исчезнут. Удобно, когда карта забита войсками.</div>
    ${data.nations.map(n=>`<div class="checkrow"><input type="checkbox" data-hl value="${n.id}" ${(data.meta.hideDivLabels||[]).includes(n.id)?'checked':''}> ${esc(n.name)}</div>`).join("")}
    <div class="btnrow"><button id="ly_allon">Скрыть у всех</button><button id="ly_alloff">Показать у всех</button></div>
  `,[["Готово","primary",()=>{
    for(const k of Object.keys(DEF_LAYERS))layers[k]=$("#ly_"+k).checked;
    const hl=[...document.querySelectorAll("input[data-hl]:checked")].map(i=>i.value);
    if(hl.join()!==(data.meta.hideDivLabels||[]).join()){snapshot(true);markDirty();}
    data.meta.hideDivLabels=hl;
    closeModal();showMini();render();
  }]]);
  const mm=$("#modals").lastElementChild;
  mm.querySelector("#ly_allon").onclick=()=>mm.querySelectorAll("input[data-hl]").forEach(i=>i.checked=true);
  mm.querySelector("#ly_alloff").onclick=()=>mm.querySelectorAll("input[data-hl]").forEach(i=>i.checked=false);
});

/* ---- подложки режимов: своя картинка под каждый фильтр ---- */
function attachUnderlay(mode,file){
  const url=URL.createObjectURL(file);
  let el=document.querySelector(`#world img.under[data-mode="${mode}"]`);
  if(!el){
    el=document.createElement("img");
    el.className="under";el.dataset.mode=mode;
    world.insertBefore(el,svg);
  }
  el.onload=()=>{
    if(mapLoaded){el.width=img.naturalWidth;el.height=img.naturalHeight;}
    underlays[mode]=url;
    data.meta.underlayHints[mode]=file.name;
    updateBackgrounds();render();buildMini();
    toast(`Подложка «${MODES.find(m=>m[0]===mode)[1]}» подключена`);

function openModal(title,bodyHtml,buttons,cls){
  const m=document.createElement("div");
  m.className="modal-back";
  m.innerHTML=`<div class="modal">
    <div class="mhead"><span>${title}</span><span class="close">✕</span></div>
    <div class="mbody">${bodyHtml}</div>
    <div class="mfoot"></div></div>`;
  if(cls)m.querySelector(".modal").classList.add(cls);
  m.querySelector(".close").onclick=()=>m.remove();
  /* клик по затемнению вокруг окна закрывает его (кроме экрана входа) */
  m.addEventListener("pointerdown",e=>{ if(e.target===m&&title&&role)m.remove(); });
  const foot=m.querySelector(".mfoot");
  (buttons||[]).forEach(([label,cls,fn])=>{
    const b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;
    b.onclick=fn;foot.appendChild(b);
  });
  $("#modals").appendChild(m);
  return m;
}
function closeModal(){const m=$("#modals").lastElementChild;if(m)m.remove();}
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.style.display="block";t.style.opacity=1;
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.style.display="none",350)},2600);
}

   СОХРАНЕНИЕ / ЭКСПОРТ / КАРТА
   ============================================================= */
/* ---------- работа с файлом как в настольной программе ---------- */
let fileHandle=null, dirty=false, lastSaved=0;
const canFS = typeof window.showSaveFilePicker === "function";
function markDirty(){
  if(dirty)return; dirty=true;
  const el=$("#dirtyMark"); if(el)el.style.display="";
  document.title="● "+document.title.replace(/^● /,"");
}
function markClean(){
  dirty=false; lastSaved=Date.now();
  const el=$("#dirtyMark"); if(el)el.style.display="none";
  document.title=document.title.replace(/^● /,"");
}
async function writeHandle(){
  if(!fileHandle)return false;
  try{
    const w=await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
    await w.close(); markClean(); return true;
  }catch(e){ console.error(e); return false; }
}
async function saveNow(quiet){
  if(!data)return;
  if(fileHandle){
    const ok=await writeHandle();
    if(!quiet)toast(ok?`Записано в ${fileHandle.name}`:"Не удалось записать файл");
    if(ok)return;
  }
  if(canFS){ await saveAs(); return; }
  download(defaultName(),data); markClean(); if(!quiet)toast("Сохранение выгружено");
}
function defaultName(){
  return role?.gm ? `vpi_master_${new Date().toISOString().slice(0,10)}.json`
                  : `vpi_${player(role.playerId)?.name||"player"}_local.json`;
}
async function saveAs(){
  if(!canFS){ download(defaultName(),data); markClean(); toast("Сохранение выгружено"); return; }
  try{
    fileHandle=await window.showSaveFilePicker({suggestedName:defaultName(),
      types:[{description:"Партия ВПИ",accept:{"application/json":[".json"]}}]});
    const ok=await writeHandle();
    toast(ok?`Файл партии: ${fileHandle.name}`:"Не удалось записать файл");
  }catch(e){}
}
/* автосохранение раз в три минуты, если файл уже выбран */
setInterval(()=>{ if(fileHandle&&dirty&&data)saveNow(true); },180000);
window.addEventListener("beforeunload",e=>{ if(dirty){e.preventDefault();e.returnValue="";} });

/* ---------- отмена действия ---------- */
const undoStack=[], redoStack=[]; let _lastSnap=0;
/* снимок берётся сразу, до изменения, но не чаще раза в 400 мс */
function snapshot(force){
  if(!data)return;
  const now=Date.now();
  if(!force && now-_lastSnap<400) return;
  _lastSnap=now;
  try{
    undoStack.push(JSON.stringify(data));
    if(undoStack.length>30)undoStack.shift();
    redoStack.length=0;
  }catch(e){}
}
function restore(stack,other){
  if(!stack.length){toast("Дальше некуда");return;}
  try{ other.push(JSON.stringify(data)); }catch(e){}
  data=JSON.parse(stack.pop());
  selection=null; closeInspector(); bumpBorders(); bumpWar(); _pbox.clear(); render(); markDirty();
  toast(stack===undoStack?"Действие отменено":"Действие возвращено");
}
function download(name,obj){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$("#btnSave").addEventListener("click",()=>saveNow(false));
$("#btnSaveAs").addEventListener("click",()=>saveAs());

function filterForPlayer(pid){
  const d=JSON.parse(JSON.stringify(data));
  d.meta.gmCode="";d.meta.lockedRole=pid;
  d.players=d.players.filter(p=>p.id===pid);
  const pNation=d.players[0]?.nationId||null;
  const see=(vis,own)=>{
    if(vis==="all"||vis==null)return true;
    if(vis==="gm")return false;
    if(vis==="owner")return own&&own===pNation;
    if(Array.isArray(vis))return vis.includes(pid);
    return false;
  };
  d.provinces=d.provinces.filter(p=>see(p.vis,p.nationId)||(Array.isArray(p.secretVis)&&p.secretVis.includes(pid)));
  d.provinces.forEach(p=>{
    /* провинция попала в сборку только из-за открытого скрытого — делаем её видимой игроку */
    if(!see(p.vis,p.nationId))p.vis="all";
    if(!p.secretVis.includes(pid))p.secret="";
    p.secretVis=p.secretVis.filter(x=>x===pid);
    /* экономика вырезается физически, если провинция не твоей нации */
    if(!(p.nationId&&p.nationId===pNation)){p.stats.resv={};p.stats.fab="";p.stats.fabs=[];p.stats.mines=[];}
  });
  d.cities=d.cities.filter(c=>see(c.vis,null));
  d.divisions=d.divisions.filter(x=>see(x.vis,x.nationId));
  d.structures=d.structures.filter(x=>see(x.vis,x.nationId));
  d.deposits=(d.deposits||[]).filter(x=>see(x.vis,x.nationId));
  d.rails=(d.rails||[]).filter(x=>see(x.vis,x.nationId));
  d.roads=(d.roads||[]).filter(x=>see(x.vis,x.nationId));
  d.arrows=(d.arrows||[]).filter(x=>see(x.vis,x.nationId));
  d.zones=(d.zones||[]).filter(x=>see(x.vis,x.nationId));
  d.theatres=(d.theatres||[]).filter(x=>see(x.vis,null));
  d.templates=(d.templates||[]).filter(t=>t.nationId===pNation);  /* штаты чужих армий игроку не видны */
  /* запасы и экономика — только своего государства; эталон стат-листа — только у ГМа */
  const st=d.stocks||{};
  d.stocks={res:{},eq:{}};
  if(pNation){ if(st.res?.[pNation])d.stocks.res[pNation]=st.res[pNation]; if(st.eq?.[pNation])d.stocks.eq[pNation]=st.eq[pNation]; }
  delete d.statRef;
  d.econ.nat = pNation&&d.econ.nat[pNation] ? {[pNation]:d.econ.nat[pNation]} : {};
  if(pNation&&d.econ.nat[pNation]&&!d.provinces.some(p=>p.id===d.econ.nat[pNation].cap)) d.econ.nat[pNation].cap=null;
  d.econ.log=(d.econ.log||[]).map(e=>({year:e.year,at:e.at,nat:pNation&&e.nat?.[pNation]?{[pNation]:e.nat[pNation]}:{}}));
  return d;
}

/* =============================================================
   СНИМОК КАРТЫ
   Пересобирает карту в полном разрешении: подложка или основная
   карта плюс все нарисованные из json слои, без экранного
   масштабирования и без потери качества.
   ============================================================= */
const SHOT_FONTS = 'Consolas,"JetBrains Mono","Courier New",monospace';
const SHOT_MAXPX = 260000000;   /* предел площади холста в браузере */

/* картинка, лежащая сейчас под картой */
function shotBgEl(which){
  const mode=$("#mapMode").value;
  if(which!=="map" && underlays[mode]){
    const el=document.querySelector(`#world img.under[data-mode="${mode}"]`);
    if(el && el.complete && el.naturalWidth) return el;
  }
  return (img.complete && img.naturalWidth) ? img : null;
}

/* во сколько раз фон крупнее координатной сетки карты: подложка может быть подробнее основного файла */
function shotNativeScale(which){
  const bg=shotBgEl(which);
  if(!bg||!img.naturalWidth) return 1;
  const k=bg.naturalWidth/img.naturalWidth;
  return (k>0&&isFinite(k))?k:1;
}
/* область съёмки в координатах карты */
function shotRegion(kind,id){
  const W=img.naturalWidth||4000, H=img.naturalHeight||3000;
  if(kind==="view"){
    const r=vp.getBoundingClientRect();
    const x0=-view.x/view.s, y0=-view.y/view.s;
    return clampRegion(x0,y0,r.width/view.s,r.height/view.s,W,H);
  }
  if(kind==="theatre"){
    const th=(data.theatres||[]).find(x=>x.id===id);
    if(th&&th.points&&th.points.length>2){
      const b=bboxOf(th.points), m=Math.max(40,(b[2]-b[0])*0.04);
      return clampRegion(b[0]-m,b[1]-m,(b[2]-b[0])+m*2,(b[3]-b[1])+m*2,W,H);
    }
  }
  if(kind==="zone"){
    const z=(data.zones||[]).find(x=>x.id===id);
    if(z&&z.points&&z.points.length>2){
      const b=bboxOf(z.points), m=Math.max(40,(b[2]-b[0])*0.06);
      return clampRegion(b[0]-m,b[1]-m,(b[2]-b[0])+m*2,(b[3]-b[1])+m*2,W,H);
    }
  }
  return {x:0,y:0,w:W,h:H};
}
function clampRegion(x,y,w,h,W,H){
  x=Math.max(0,Math.floor(x)); y=Math.max(0,Math.floor(y));
  w=Math.ceil(Math.min(w,W-x)); h=Math.ceil(Math.min(h,H-y));
  return {x,y,w:Math.max(1,w),h:Math.max(1,h)};
}

/* синхронно собрать svg всей области: подменяем вид, рисуем, возвращаем как было */
function shotBuildSVG(reg,scale,opt){
  const keepView={...view}, keepSel=selection, keepHover=hoverStruct;
  const keepLegend=layers.legend;
  const cw=Math.round(reg.w*scale), ch=Math.round(reg.h*scale);
  let str="";
  try{
    selection=null; hoverStruct=null;
    if(opt.legend!==undefined) layers.legend=!!opt.legend;
    view={x:-reg.x*scale, y:-reg.y*scale, s:scale};
    _shotOn=true;
    _shotNat=(opt.nations&&opt.nations.length)?new Set(opt.nations):null;
    const pad=Math.max(reg.w,reg.h)*0.06+200;
    _shotVB=[reg.x-pad, reg.y-pad, reg.x+reg.w+pad, reg.y+reg.h+pad];
    _shotCM = opt.icons ? false : null;
    _baseDirty=true; drawBase(); drawOverlay();
    str='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"'
      + ` width="${cw}" height="${ch}" viewBox="${reg.x} ${reg.y} ${reg.w} ${reg.h}">`
      + `<style>text{font-family:${SHOT_FONTS}}</style>`
      + svg.innerHTML + svg2.innerHTML + '</svg>';
  } finally {
    _shotVB=null; _shotCM=null; _shotOn=false; _shotNat=null;
    view=keepView; selection=keepSel; hoverStruct=keepHover; layers.legend=keepLegend;
    _baseDirty=true; drawFrame();
  }
  return {str,cw,ch};
}

async function shotRender(opt){
  if(!mapLoaded){toast("Сначала подключи файл карты");return;}
  const reg=shotRegion(opt.area,opt.areaId);
  const scale=(opt.scale==="native")?shotNativeScale(opt.bg):(+opt.scale||1);
  const cw=Math.round(reg.w*scale), ch=Math.round(reg.h*scale);
  if(cw*ch>SHOT_MAXPX){toast("Слишком крупно для браузера — уменьши масштаб или возьми область поменьше");return;}

  toast("Собираю снимок…");
  const built=shotBuildSVG(reg,scale,opt);

  /* растеризация svg */
  const blob=new Blob([built.str],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  let layer=null;
  try{
    layer=await new Promise((res,rej)=>{
      const im=new Image();
      im.onload=()=>res(im);
      im.onerror=()=>rej(new Error("svg"));
      im.src=url;
    });
  }catch(e){
    URL.revokeObjectURL(url);
    toast("Браузер не смог отрисовать слои — попробуй меньший масштаб");
    return;
  }

  const cv=document.createElement("canvas");
  cv.width=cw; cv.height=ch;
  const g=cv.getContext("2d",{alpha:opt.bg==="none"&&opt.fmt==="png"});
  if(!g){URL.revokeObjectURL(url);toast("Не удалось создать холст такого размера");return;}
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";

  if(opt.bg!=="none"||opt.fmt==="jpeg"){
    const bg=opt.bg==="none"?null:shotBgEl(opt.bg);
    if(!bg||opt.bg==="none"){ g.fillStyle="#14161a"; g.fillRect(0,0,cw,ch); }
    if(bg){
      /* подложка может быть крупнее или мельче основного файла: переводим прямоугольник в её пиксели */
      const kx=bg.naturalWidth/(img.naturalWidth||bg.naturalWidth);
      const ky=bg.naturalHeight/(img.naturalHeight||bg.naturalHeight);
      g.drawImage(bg, reg.x*kx, reg.y*ky, reg.w*kx, reg.h*ky, 0,0,cw,ch);
    }
  }
  g.drawImage(layer,0,0,cw,ch);
  URL.revokeObjectURL(url);

  const mime=opt.fmt==="png"?"image/png":"image/jpeg";
  const ext=opt.fmt==="png"?"png":"jpg";
  const q=opt.fmt==="png"?undefined:Math.max(0.5,Math.min(1,opt.quality||0.92));
  cv.toBlob(b=>{
    if(!b){toast("Снимок не поместился в память — уменьши масштаб");return;}
    const stamp=new Date().toISOString().slice(0,10);
    const tag=opt.areaName?("_"+opt.areaName.replace(/[^\wа-яА-ЯёЁ]+/g,"-").slice(0,40)):"";
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=`vpi_карта${tag}_${cw}x${ch}_${stamp}.${ext}`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    toast(`Снимок готов: ${cw}×${ch}, ${(b.size/1048576).toFixed(1)} МБ`);
  },mime,q);
}

function pickMap(cb){

  inp.type="file";inp.accept="image/*";

        el.setAttribute("width",img.naturalWidth);el.setAttribute("height",img.naturalHeight);

}

let panelNation=null, panelTplType="inf";
function distributeEquip(nid){
  const divs=data.divisions.filter(d=>d.nationId===nid);
  if(!divs.length){toast("У страны нет соединений");return;}
  data.stocks.eq[nid]=data.stocks.eq[nid]||{};
  let touched=0, over=[];
  for(const [k,label] of EQUIP){
    const total=num(data.stocks.eq[nid][k]);
    /* соединения, которым этот вид положен по штату */
    const list=divs.map(d=>({d,cap:divCap(d,k)})).filter(x=>x.cap===null||x.cap>0)
                   .map(x=>({d:x.d,cap:x.cap===null?Infinity:x.cap,cur:0}));
    /* тем, кому не положено, — вычищаем */
    divs.forEach(d=>{ if(divCap(d,k)===0 && d.eq?.[k]){ delete d.eq[k]; touched++; } });
    if(total<=0||!list.length) continue;
    let pool=total, active=list.slice();
    while(pool>0&&active.length){
      const share=Math.floor(pool/active.length);
      if(share<1){
        for(const x of active){ if(pool<=0)break; if(x.cur<x.cap){x.cur++;pool--;} }
        break;
      }
      for(const x of active){ const add=Math.min(share,x.cap-x.cur); x.cur+=add; pool-=add; }
      active=active.filter(x=>x.cur<x.cap);
    }
    list.forEach(x=>{ x.d.eq=x.d.eq||{}; if(x.cur>0)x.d.eq[k]=String(x.cur); else delete x.d.eq[k]; });
    touched++;
    const staff=list.reduce((a,x)=>a+(x.cap===Infinity?0:x.cap),0);
    if(staff&&total>staff) over.push(`${label}: лишку ${total-staff}`);
  }
  toast(over.length?("Распределено. Сверх штата осталось — "+over.join(", ")):(touched?"Снаряжение распределено по штату":"Нечего распределять: заполни «всего у страны»"));
}

      <div class="hint">Аэродромов: ${fields.length} · узлов снабжения: ${supplyN}. Дальность полёта задаётся радиусом каждого аэродрома.</div>`:""}

    <h3 class="sec">Промышленность</h3>

    <table class="ledger"><tr><th>Позиция</th><th>Стат-лист</th><th>На карте</th><th>Разница</th></tr>${refRows}</table>
    <div class="btnrow"><button id="cp_pullmap">Взять значения с карты</button><button id="cp_clearref" class="danger">Очистить эталон</button></div>

    <h3 class="sec">Ресурсы</h3>
    <div class="hint" style="margin-top:0">Запасы, добыча, заводы, модификаторы и снабжение теперь ведутся в окне «💰 Экономика». Выпуск оружейных, артиллерийских, автомобильных и танковых заводов пополняет «Всего у страны» в таблице снаряжения ниже при каждом «Прошёл год».</div>
    <div class="btnrow"><button id="cp_econ">💰 Открыть экономику государства</button></div>

    <h3 class="sec">Снаряжение</h3>
    <table class="ledger"><tr><th>Вид</th><th>Всего у страны</th><th>В дивизиях</th><th>Штат</th><th>На складе</th><th>Некомплект</th></tr>${eqRows}</table>
    <div class="btnrow"><button id="cp_dist">⇄ Распределить поровну по дивизиям</button></div>
    <div class="hint">«Всего у страны» — весь наличный запас, включая то, что уже в частях. «На складе» = всего − в дивизиях (красное — в частях числится больше, чем есть в стране). «Некомплект» = штат − в дивизиях.<br>
    Распределение раскладывает «всего у страны» поровну по соединениям, которым этот вид положен по штату, и не превышает штатных лимитов; чего по штату не полагается — из частей вычищается.</div>

    <h3 class="sec">Обученность</h3>
    <div class="list-row">
      <select id="cp_train" style="flex:1">${TRAINING.map(t=>`<option>${t}</option>`).join("")}</select>
      <button id="cp_settrain">Выдать всем соединениям</button>
    </div>
    <div class="hint">Ставит выбранный уровень всем ${data.divisions.filter(d=>d.nationId===nid).length} соединениям этой страны разом.</div>

    <h3 class="sec">Шаблон дивизии</h3>
    <label>Тип соединения</label>
    <select id="cp_type">${DIV_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===panelTplType?'selected':''}>${t[1]}</option>`).join("")}</select>
    <div class="eqgrid" style="margin-top:8px">
      ${EQUIP.map(([k,n])=>`<span>${n}</span><input data-tpl="${k}" value="${esc(tpl.limits[k]||"")}" placeholder="—"><span class="lim">штат</span>`).join("")}
    </div>
    <div class="hint">Один шаблон на тип соединения в стране: все её ${DIV_TYPES.find(t=>t[0]===panelTplType)?.[1].toLowerCase()} получают эти лимиты. Соединений этого типа сейчас: <b style="color:var(--brass)">${data.divisions.filter(d=>d.nationId===nid&&d.type===panelTplType).length}</b>.</div>
  `,[["Применить","primary",()=>{
    snapshot(true); savePanel(); markDirty(); closeModal(); render(); renderInspector(); toast("Данные страны сохранены");

  function savePanel(){
    m.querySelectorAll("[data-ref]").forEach(i=>{const v=i.value.trim();
      if(v)data.statRef[nid][i.dataset.ref]=v; else delete data.statRef[nid][i.dataset.ref];});
    m.querySelectorAll("[data-sres]").forEach(i=>{const v=i.value.trim();if(v)data.stocks.res[nid][i.dataset.sres]=v;else delete data.stocks.res[nid][i.dataset.sres];});
    m.querySelectorAll("[data-seq]").forEach(i=>{const v=i.value.trim();if(v)data.stocks.eq[nid][i.dataset.seq]=v;else delete data.stocks.eq[nid][i.dataset.seq];});
    m.querySelectorAll("[data-tpl]").forEach(i=>{const v=i.value.trim();if(v)tpl.limits[i.dataset.tpl]=v;else delete tpl.limits[i.dataset.tpl];});

  m.querySelector("#cp_pullmap").onclick=()=>{

    savePanel();
    const lvl=m.querySelector("#cp_train").value;

  m.querySelector("#cp_dist").onclick=()=>{snapshot(true);markDirty();savePanel();distributeEquip(nid);m.remove();openCountryPanel();render();};

/* =============================================================
   ОКНО ЭКОНОМИКИ: пул государства, модификаторы, прибавки,
   снабжение, провинции с предприятиями, журнал лет
   ============================================================= */
let econNation=null, econShowAll=false;
function afterEcon(){ const p=selProv(); if(p)refreshInsPool(p); }
function openEconPanel(nid){
  if(!data)return;
  const gm=!!role.gm;
  const list=gm?data.nations:data.nations.filter(n=>n.id===myNation());
  if(!list.length){toast(gm?"Сначала заведи государства в Настройках":"Тебе не назначено государство");return;}
  nid=(nid&&list.some(n=>n.id===nid))?nid:(econNation&&list.some(n=>n.id===econNation)?econNation:list[0].id);
  econNation=nid;
  const m=openModal("Экономика государства","",[["Закрыть","primary",closeModal]],"wide");
  const body=m.querySelector(".mbody");
  const q=s=>body.querySelector(s);
  const draw=()=>{
    if(!m.isConnected)return;
    const e=econNat(nid), cap=econCap(nid), provs=data.provinces.filter(p=>p.nationId===nid);
    const rowsP=provs.filter(p=>(p.stats.mines||[]).some(x=>+x.amt)||(p.stats.fabs||[]).some(f=>num(f.count))).map(p=>
      `<tr data-pv="${p.id}" style="cursor:pointer" title="Показать провинцию на карте"><td>${cap?.id===p.id?"◈ ":""}${esc(p.name)}</td>
        <td style="text-align:left;white-space:normal">${(p.stats.mines||[]).filter(x=>+x.amt).map(x=>esc(resName(x.res))+" "+fmtN(x.amt)).join(", ")||"—"}</td>
        <td style="text-align:left;white-space:normal">${(p.stats.fabs||[]).filter(f=>num(f.count)).map(f=>esc(facLabel(f.type))+" ×"+esc(f.count)).join(", ")||"—"}</td></tr>`).join("");
    const logs=(data.econ.log||[]).filter(l=>l.nat?.[nid]).slice(0,6);
    const sc=body.scrollTop;
    body.innerHTML=`
      <div class="list-row" style="margin-bottom:6px">
        ${gm?`<select id="ec_nat" style="flex:1" title="Государство">${list.map(n=>`<option value="${n.id}" ${n.id===nid?'selected':''}>${esc(n.name)}</option>`).join("")}</select>`
            :`<b style="flex:1;font-family:var(--serif);font-size:15px;color:${nation(nid)?.color||"var(--ink)"}">${esc(nation(nid)?.name||"")}</b>`}
        <span class="pill" style="font-size:11px;padding:3px 8px;flex:0 0 auto" title="Счётчик лет партии: растёт при каждом «Прошёл год»">год ${data.econ.year}</span>
      </div>
      <div class="list-row"><span style="flex:0 0 auto;color:var(--ink-dim);font-size:11px;letter-spacing:.05em">СТОЛИЦА ЭКОНОМИКИ</span>
        ${gm?`<select id="ec_cap" style="flex:1" title="Провинция, в карточке которой показывается пул государства">
              <option value="">авто — ${esc(!e.cap&&cap?cap.name:"столичный город или крупнейшая провинция")}</option>
              ${provs.map(p=>`<option value="${p.id}" ${e.cap===p.id?'selected':''}>${esc(p.name)}</option>`).join("")}</select>`
            :`<span style="flex:1">${esc(cap?.name||"—")}</span>`}
        ${cap?`<button id="ec_go" title="Показать провинцию на карте">◎ На карте</button>`:""}
      </div>
      ${gm?`<div class="btnrow" style="margin-top:6px">
        <button id="ec_year" class="primary" title="Применить итог за год к запасам всех государств">⏭ Прошёл год</button>
        <button id="ec_rec" title="Что потребляют и выпускают заводы каждого типа">⚙ Механика заводов</button>
        <button id="ec_all" title="Показать в таблице все ресурсы, чтобы вписать запасы или снабжение">${econShowAll?"Только ненулевые":"Все ресурсы"}</button></div>`:""}
      <div id="ec_pool">${poolTable(nid,{full:true,edit:gm,all:gm&&econShowAll})}</div>
      <div class="hint">Итог/год = (добыча + выпуск заводов) × (1 + модификатор %) + прибавки − потребление заводов − снабжение. Наведи на строку — откуда приходит и куда уходит ресурс.
        ${gm?"Запас, модификатор и снабжение правятся прямо в таблице и сразу пересчитываются.":""}</div>
      <h3 class="sec">Прибавки и убыли</h3>
      <div class="hint" style="margin-top:0">Торговля, дань, особые приросты и потери — постоянная прибавка к ресурсу каждый год (убыль — со знаком минус).</div>
      <div id="ec_adds">${(e.adds||[]).map(a=>gm
        ?`<div class="rowx"><select data-ar="${a.id}" style="flex:0 0 180px">${resOptions(a.res)}</select>
            <input class="q" type="number" step="any" data-aa="${a.id}" value="${a.amt}" title="В год; убыль — со знаком минус">
            <input data-an="${a.id}" value="${esc(a.note)}" placeholder="Откуда: торговля с …, особый прирост…">
            <button class="danger" data-ad="${a.id}" title="Убрать прибавку">✕</button></div>`
        :`<div class="rowx"><span class="lbl">${esc(resName(a.res))} · ${esc(a.note||"прибавка")}</span><span class="io ${sgnC(a.amt)}" style="font-size:12px">${pmN(a.amt)}</span></div>`).join("")
        ||'<div class="hint">Нет.</div>'}</div>
      ${gm?`<div class="btnrow"><button id="ec_addadd">+ Прибавка / убыль</button></div>`:""}
      <h3 class="sec">Провинции и предприятия</h3>
      ${rowsP?`<table class="pool"><tr><th>Провинция</th><th style="text-align:left">Добыча в год</th><th style="text-align:left">Предприятия</th></tr>${rowsP}</table>`
        :`<div class="hint">В провинциях государства пока нет ни добычи, ни предприятий.${gm?" Они добавляются в карточке провинции.":""}</div>`}
      <h3 class="sec">Журнал лет</h3>
      <div class="econlog">${logs.length?logs.map(l=>`<div class="card" style="padding:6px 10px;border-left-color:var(--line)">
          <div class="sub" style="margin:0 0 3px">Год ${l.year} · ${esc(l.at||"")}</div>
          <div style="font-size:11px;line-height:1.7">${l.nat[nid].map(([k,was,net,nv,lack])=>`${esc(resName(k))}: ${fmtN(was)} → <b>${fmtN(nv)}</b> <span class="${sgnC(net)}">(${pmN(net)})</span>${lack?` <span class="minus">нехватка ${fmtN(lack)}</span>`:""}`).join(" · ")}</div></div>`).join("")
        :'<div class="hint">«Прошёл год» ещё не применялся.</div>'}</div>`;
    body.scrollTop=sc;
    if(q("#ec_nat"))q("#ec_nat").onchange=ev=>{nid=econNation=ev.target.value;draw();};
    if(q("#ec_cap"))q("#ec_cap").onchange=ev=>{snapshot(true);markDirty();econNat(nid,true).cap=ev.target.value||null;render();if(selProv())reIns();draw();};
    if(q("#ec_go"))q("#ec_go").onclick=()=>{const p=econCap(nid);if(!p)return;closeModal();select("province",p.id);focusSelection();};
    if(q("#ec_year"))q("#ec_year").onclick=()=>confirmYear(draw);
    if(q("#ec_rec"))q("#ec_rec").onclick=()=>openRecipes(draw);
    if(q("#ec_all"))q("#ec_all").onclick=()=>{econShowAll=!econShowAll;draw();};
    if(q("#ec_addadd"))q("#ec_addadd").onclick=()=>{snapshot(true);markDirty();econNat(nid,true).adds.push({id:uid(),res:"coal",amt:0,note:""});draw();};
    body.querySelectorAll("[data-ad]").forEach(b=>b.onclick=()=>{snapshot(true);markDirty();const e2=econNat(nid,true);e2.adds=e2.adds.filter(a=>a.id!==b.dataset.ad);draw();afterEcon();});
    body.querySelectorAll("[data-pv]").forEach(tr=>tr.onclick=()=>{closeModal();select("province",tr.dataset.pv);focusSelection();});
  };
  /* поля пишутся в данные на лету, вычисляемые ячейки пересчитываются без перерисовки окна */
  const onField=ev=>{
    if(!gm)return;
    const t=ev.target, d=t.dataset, e=econNat(nid,true);
    let pool=false;
    if(d.est!==undefined) stockSet(nid,d.est,t.value.trim());
    else if(d.emod!==undefined){const v=t.value.trim(); if(v)e.mods[d.emod]=+v.replace(",",".")||0; else delete e.mods[d.emod];}
    else if(d.eneed!==undefined){const v=t.value.trim(); if(v)e.need[d.eneed]=v; else delete e.need[d.eneed];}
    else if(d.ar||d.aa||d.an){
      const a=e.adds.find(x=>x.id===(d.ar||d.aa||d.an)); if(!a)return;
      if(d.ar)a.res=t.value; if(d.aa)a.amt=+t.value||0; if(d.an)a.note=t.value;
      pool=true;
    } else return;
    if(ev.type==="input"){snapshot();markDirty();}
    if(pool&&ev.type==="change") q("#ec_pool").innerHTML=poolTable(nid,{full:true,edit:gm,all:gm&&econShowAll});
    else refreshPool(q("#ec_pool"),nid);
    afterEcon();
  };
  body.addEventListener("input",onField); body.addEventListener("change",onField);
  draw();
}
$("#btnEcon").addEventListener("click",()=>openEconPanel(role?.gm?null:myNation()));

/* ---- «Прошёл год»: итог каждого ресурса ложится в запас ---- */
function confirmYear(after){
  if(!role?.gm)return;
  if(!data.nations.length){toast("Сначала заведи государства");return;}
  const rows=data.nations.map(n=>{
    const R=econCalc(n.id); let up=0,down=0; const lack=[];
    for(const [k,r] of Object.entries(R)){ if(r.net>0)up++; else if(r.net<0){down++; if(r.stock+r.net<0)lack.push(resName(k));} }
    return `<tr><td>${esc(n.name)}</td><td class="plus">${up||"—"}</td><td class="minus">${down||"—"}</td>
      <td style="text-align:left;white-space:normal" class="${lack.length?"minus":"dim"}">${esc(lack.join(", "))||"—"}</td></tr>`;
  }).join("");
  openModal(`Прошёл год ${data.econ.year}`,`
    <div class="hint" style="margin-top:0;margin-bottom:6px">Годовой итог каждого ресурса прибавится к запасам всех государств. Если запаса не хватает, он обнуляется, а нехватка пишется в журнал. Отменить можно через Ctrl+Z.</div>
    <table class="pool"><tr><th>Государство</th><th>Растёт</th><th>Убывает</th><th style="text-align:left">Не хватит</th></tr>${rows}</table>`,
    [["Применить","primary",()=>{closeModal();passYear();if(after)after();}],["Отмена","",closeModal]]);
}
function passYear(){
  if(!role?.gm)return;
  snapshot(true); markDirty();
  const y=data.econ.year, entry={year:y,at:new Date().toISOString().slice(0,10),nat:{}};
  let short=0;
  for(const n of data.nations){
    const R=econCalc(n.id), lines=[];
    for(const [k,r] of Object.entries(R)){
      if(!r.net)continue;
      const was=r.stock; let nv=rnd(was+r.net), lack=0;
      if(nv<0){lack=-nv;nv=0;short++;}
      stockSet(n.id,k,nv);
      lines.push([k,was,r.net,nv,lack]);
    }
    if(lines.length)entry.nat[n.id]=lines;
  }
  data.econ.log.unshift(entry); if(data.econ.log.length>30)data.econ.log.length=30;
  data.econ.year=y+1;
  render(); if(selection)reIns();
  toast(`Прошёл год ${y}. Запасы пересчитаны${short?` · нехватка по ${short} позициям — см. журнал`:""}`);
}

/* ---- механика заводов: входы и выходы каждого типа ---- */
function openRecipes(after){
  if(!role?.gm)return;
  const m=openModal("Механика заводов","",[["Готово","primary",()=>{closeModal();if(after)after();}]],"wide");
  const body=m.querySelector(".mbody");
  const side=(t,sd)=>Object.entries(data.econ.recipes[t][sd]||{}).map(([k,v])=>
    `<div class="rowx"><select data-rk="${t}|${sd}|${k}">${resOptions(k)}</select>
      <input class="q" type="number" min="0" step="any" data-rq="${t}|${sd}|${k}" value="${v}" title="В год на одно предприятие">
      <button class="danger" data-rx="${t}|${sd}|${k}" title="Убрать ресурс">✕</button></div>`).join("")
    +`<button data-ra="${t}|${sd}" style="padding:2px 9px" title="Добавить ресурс">+</button>`;
  const draw=()=>{
    const sc=body.scrollTop;
    body.innerHTML=`<div class="hint" style="margin-top:0;margin-bottom:8px">Сколько одно предприятие потребляет и выпускает за год. Цифры сразу пересчитывают пулы всех государств. Это заготовка механики — подставь свои правила.</div>
      ${FACTORIES.map(f=>{
        const r=data.econ.recipes[f[0]]||(data.econ.recipes[f[0]]={in:{},out:{}}); r.in=r.in||{}; r.out=r.out||{};
        return `<div class="rcard"><h4>${f[2]} ${f[1]}</h4><div class="cols">
          <div><div class="cap">Потребляет</div>${side(f[0],"in")}</div>
          <div><div class="cap">Производит</div>${side(f[0],"out")}</div></div></div>`;}).join("")}
      <div class="btnrow"><button id="rc_def" class="danger">Вернуть цифры по умолчанию</button></div>`;
    body.scrollTop=sc;
  };
  body.addEventListener("change",ev=>{
    const t=ev.target;
    if(t.dataset.rk){
      const [f,sd,k]=t.dataset.rk.split("|"), o=data.econ.recipes[f][sd];
      if(t.value!==k&&o[t.value]!==undefined){toast("Этот ресурс уже есть в списке");draw();return;}
      snapshot(true);markDirty(); const v=o[k]; delete o[k]; o[t.value]=v; draw(); afterEcon();
    }
    if(t.dataset.rq){const [f,sd,k]=t.dataset.rq.split("|"); snapshot(true);markDirty(); data.econ.recipes[f][sd][k]=Math.max(0,+t.value||0); afterEcon();}
  });
  body.addEventListener("click",ev=>{
    const t=ev.target;
    if(t.dataset.rx){const [f,sd,k]=t.dataset.rx.split("|"); snapshot(true);markDirty(); delete data.econ.recipes[f][sd][k]; draw(); afterEcon();}
    if(t.dataset.ra){
      const [f,sd]=t.dataset.ra.split("|"), o=data.econ.recipes[f][sd];
      const k=ECON_RES.map(r=>r[0]).find(x=>o[x]===undefined); if(!k)return;
      snapshot(true);markDirty(); o[k]=1; draw(); afterEcon();
    }
    if(t.id==="rc_def"){
      if(!confirm("Вернуть все цепочки заводов к значениям по умолчанию?"))return;
      snapshot(true);markDirty(); data.econ.recipes=JSON.parse(JSON.stringify(DEF_RECIPES)); draw(); afterEcon();
    }
  });
  draw();
}

/* =============================================================

/* --- 2. Поиск по карте --- */
function openSearch(){
  const m=openModal("Поиск по карте",`
    <input id="sq" placeholder="Название провинции, города, соединения, месторождения…" autocomplete="off">
    <div id="sres" style="margin-top:10px;max-height:46vh;overflow:auto"></div>
  `,[]);
  const inp=m.querySelector("#sq"), box=m.querySelector("#sres");
  const jump=(x,y,kind,id)=>{
    m.remove();
    if(kind){select(kind,id); if(!focusSelection())flyTo(x,y,Math.max(view.s,0.6));}
    else flyTo(x,y,Math.max(view.s,0.6));
  };
  const run=()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){box.innerHTML='<div class="hint">Введи хотя бы две буквы.</div>';return;}
    const out=[];
    const add=(kind,label,sub,x,y,id)=>out.push({kind,label,sub,x,y,id});
    for(const p2 of data.provinces) if(p2.name.toLowerCase().includes(q)&&canSee(p2.vis,p2.nationId))
      add("province",p2.name,"провинция · "+(nation(p2.nationId)?.name||"ничья"),...centroid(p2.points),p2.id);
    for(const c of data.cities) if(c.name.toLowerCase().includes(q)&&canSee(c.vis,null))
      add("city",c.name,"город",c.x,c.y,c.id);
    for(const u of data.divisions) if(u.name.toLowerCase().includes(q)&&canSee(u.vis,u.nationId))
      add("division",u.name,(nation(u.nationId)?.name||"")+" · соединение",u.x,u.y,u.id);
    for(const st of data.structures) if(st.name.toLowerCase().includes(q)&&canSee(st.vis,st.nationId))
      add("structure",st.name,"постройка",st.x,st.y,st.id);
    for(const z of (data.zones||[])) if((z.name||"").toLowerCase().includes(q)&&canSee(z.vis,z.nationId)&&z.points.length>2)
      add("zone",z.name,"штриховая область",...centroid(z.points),z.id);
    for(const ar of (data.arrows||[])) if((ar.name||"").toLowerCase().includes(q)&&canSee(ar.vis,ar.nationId)&&ar.pts.length>1)
      add("arrow",ar.name,"стрелка",...centroid(ar.pts),ar.id);
    for(const rd of (data.roads||[])) if((rd.name||"").toLowerCase().includes(q)&&canSee(rd.vis,rd.nationId)&&rd.pts.length)
      add("road",rd.name,"дорога · "+roadClass(rd.cls)[1].toLowerCase(),...centroid(rd.pts),rd.id);
    for(const dp of data.deposits) if(dp.name.toLowerCase().includes(q)&&canSee(dp.vis,dp.nationId))
      add("deposit",dp.name,"месторождение",dp.x,dp.y,dp.id);
    for(const th of (data.theatres||[])) if(th.name.toLowerCase().includes(q)&&th.points.length>2&&canSee(th.vis,null))
      add("theatre",th.name,"театр",...centroid(th.points),th.id);
    box.innerHTML=out.slice(0,40).map((o,i)=>
      `<div class="warrow" data-i="${i}" style="border-left-color:var(--line)"><div style="flex:1">
        <b>${esc(o.label)}</b><div class="s">${esc(o.sub)}</div></div></div>`).join("")
      ||'<div class="hint">Ничего не найдено.</div>';
    box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{
      const o=out[+el.dataset.i]; jump(o.x,o.y,o.kind,o.id);
    });
  };
  inp.addEventListener("input",run);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){const f=box.querySelector("[data-i]"); if(f)f.click();} });
  setTimeout(()=>inp.focus(),30);
}

    <div class="btnrow"><button id="bk_del" class="danger">Удалить выбранное</button></div>
  `,[["Применить","primary",()=>{
    const nat=$("#bk_nat").value, vis=$("#bk_vis").value, tr=$("#bk_tr").value;
    const q=$("#bk_q").value, ty=$("#bk_ty").value, sh=$("#bk_shot").value;
    const str=$("#bk_str").value, nm=$("#bk_nm").value, n0=+$("#bk_n0").value||1;
    snapshot(); markDirty();
    let i=n0;
    for(const o of groupSel){
      if(nat&&"nationId" in o.o)o.o.nationId=nat;
      if(vis)o.o.vis=vis;
      if(sh!=="")o.o.noShot = sh==="1";
      if(o.k==="division"){
        if(tr)o.o.training=tr;
        if(q)o.o.quality=q;
        if(ty)o.o.type=ty;
        if(str)o.o.strength=str;
      }
      if(nm){ o.o.name = nm.includes("#") ? nm.replace(/#/g,String(i)) : nm; i++; }
    }
    groupSel=[];closeModal();bumpWar();render();toast("Изменения применены");
  }]]);
  m.querySelector("#bk_del").onclick=()=>{
    if(!confirm(`Удалить ${groupSel.length} объектов?`))return;
    snapshot(); markDirty();
    const ids=new Set(groupSel.map(o=>o.o.id));
    data.divisions=data.divisions.filter(x=>!ids.has(x.id));
    data.structures=data.structures.filter(x=>!ids.has(x.id));
    data.deposits=data.deposits.filter(x=>!ids.has(x.id));
    data.cities=data.cities.filter(x=>!ids.has(x.id));
    groupSel=[];closeModal();bumpWar();render();toast("Удалено");
  };
}
function pickInBox(x0,y0,x1,y1){
  const X0=Math.min(x0,x1),X1=Math.max(x0,x1),Y0=Math.min(y0,y1),Y1=Math.max(y0,y1);
  const inb=(x,y)=>x>=X0&&x<=X1&&y>=Y0&&y<=Y1;
  const out=[];
  for(const u of data.divisions) if(inb(u.x,u.y)) out.push({k:"division",o:u});
  for(const st of data.structures) if(inb(st.x,st.y)) out.push({k:"structure",o:st});
  for(const dp of data.deposits) if(inb(dp.x,dp.y)) out.push({k:"deposit",o:dp});
  for(const c of data.cities) if(inb(c.x,c.y)) out.push({k:"city",o:c});
  return out;
}

/* --- 4. Дублирование объекта --- */
function duplicateSelected(){
  if(!selection||!role.gm)return;
  const src={division:data.divisions,structure:data.structures,deposit:data.deposits,city:data.cities}[selection.kind];
  if(!src)return;
  const o=src.find(x=>x.id===selection.id); if(!o)return;
  const c=JSON.parse(JSON.stringify(o));
  c.id=uid(); c.x=(c.x||0)+Math.round(Math.max(3,(img.naturalWidth||4000)/420)*4); 
  const m=String(c.name).match(/^(\d+)/);
  if(m)c.name=String(parseInt(m[1])+1)+c.name.slice(m[1].length);
  snapshot(true); markDirty(); src.push(c); bumpWar(); select(selection.kind,c.id);
  toast("Копия создана");
}

/* --- 5. Бросок кубика для вердиктов --- */
function openDice(){
  const roll=(n,mod)=>{
    const r=[]; for(let i=0;i<n;i++)r.push(1+Math.floor(Math.random()*100));
    const avg=Math.round(r.reduce((a,b)=>a+b,0)/n)+mod;
    return {r,avg};
  };
  const m=openModal("Бросок",`
    <label>Модификатор</label><input id="dc_mod" type="number" value="0">
    <div class="btnrow">
      <button data-n="1">1 бросок</button><button data-n="3">3 броска</button><button data-n="5">5 бросков</button>
    </div>
    <div id="dc_out" style="margin-top:10px"></div>
    <div class="hint">1-100. Модификатор прибавляется к среднему: обученность, снабжение, местность, качество отыгрыша.</div>
  `,[["Закрыть","primary",closeModal]]);
  m.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
    const {r,avg}=roll(+b.dataset.n,+m.querySelector("#dc_mod").value||0);
    const verd=avg>=85?"выдающийся успех":avg>=65?"успех":avg>=45?"частичный успех":avg>=25?"неудача":"провал";
    m.querySelector("#dc_out").innerHTML=`<div class="card"><h4>${avg} - ${verd}</h4><div class="sub">броски: ${r.join(", ")}</div></div>`;
  });
}

function openWarPanel(){
  const list=(data.theatres||[]).map(th=>{
    const f=computeFront(th);
    const colA=nation(th.sideA[0])?.color||"#c0504d", colB=nation(th.sideB[0])?.color||"#4d74c0";
    const tot=(f.A.w+f.B.w)||1, pa=Math.round(f.A.w/tot*100);
    const na=th.sideA.map(i=>nation(i)?.name).filter(Boolean).join(", ")||"—";
    const nb=th.sideB.map(i=>nation(i)?.name).filter(Boolean).join(", ")||"—";
    return `<div class="warrow" data-th="${th.id}">
      <div style="flex:1;min-width:0">
        <b>${esc(th.name)}</b>
        <div class="s">${esc(na)} против ${esc(nb)}</div>
        <div class="balance"><i style="width:${pa}%;background:${colA}"></i><i style="width:${100-pa}%;background:${colB}"></i></div>
        <div class="s">${f.A.n} : ${f.B.n} соединений · фронт ${Math.round(f.length)} px
          ${f.hot.length?`<span class="pill hot">угроза прорыва ×${f.hot.length}</span>`:""}
          ${f.pockets.length?`<span class="pill pocket">котлов ${f.pockets.length}</span>`:""}</div>
      </div></div>`;
  }).join("");
  const m=openModal("Театры военных действий",`
    ${list||'<div class="hint" style="margin-top:0">Театров нет. Инструмент ⚔ на левой панели - обведи область, назначь стороны.</div>'}
    <div class="btnrow"><button id="wp_new">+ Новый театр</button><button id="wp_recalc">↻ Пересчитать фронты</button></div>
    <div class="hint">Линия фронта строится по расположению соединений: где давление сторон уравновешивается, там проходит фронт. Кружок с восклицательным знаком - участок, где перевес одной стороны больше чем в полтора раза. Жёлтая рамка - окружённая группировка.</div>
  `,[["Закрыть","primary",closeModal]]);
  m.querySelectorAll("[data-th]").forEach(el=>el.onclick=()=>{
    const th=data.theatres.find(x=>x.id===el.dataset.th);
    closeModal(); select("theatre",th.id);
    if(th.points.length>2) flyToBox(bboxOf(th.points),0.8);
  });
  m.querySelector("#wp_new").onclick=()=>{closeModal();setTool("theatre");toast("Обведи область театра, Enter - замкнуть");};
  m.querySelector("#wp_recalc").onclick=()=>{bumpWar();closeModal();openWarPanel();render();};
}

      · Стрелки (➜, клавиша G): клики ставят точки, Enter заканчивает. Настраиваются цвет, толщина, характер линии, наконечник на конце или с обеих сторон, сглаживание изломов. Подпись ложится вдоль стрелки у её середины и сдвинута в сторону от линии, так что не садится на саму стрелку. «Продолжить» достраивает существующую, «Развернуть» меняет направление вместе с наконечником.<br>
      · Рамка (▭, клавиша B): протяни рамку по карте, как по рабочему столу, и задай общие свойства всему, что в неё попало — державу, видимость, попадание в снимок, обученность, качество, род войск, численность. Там же массовое переименование по шаблону: знак # подставляет порядковый номер, так что «# рота 4й мотострелковой» разом пронумерует десяток значков. Рамка работает и по Shift с обычным выбором.<br>
      · Пометка «не попадает в снимок карты» у соединений, построек, городов, месторождений и стрелок. Объект остаётся на карте и в сохранении, но в снимок не идёт никогда — для частей, о которых противник знать не должен.<br>
      · В окне снимка появился список держав: отметь одну или несколько, и в изображение попадут только их соединения. Ничего не отмечено — попадут все.<br>
      · Новый род войск: мотопехота (МП).<br>
    </div>
    <h3 class="sec">v2.9</h3>
    <div class="hint">
      · Снимок карты (📷 в верхней панели): карта пересобирается в изображение в полном разрешении. Фон — исходный файл карты или подложка режима, поверх него векторно дорисовываются все слои из json. Это не скриншот: резкость не зависит ни от экрана, ни от текущего увеличения.<br>
      · Масштаб «По разрешению фона» берёт подложку один к одному, без единого пересчёта пикселей. Если подложка подробнее основного файла карты, снимок выйдет в её разрешении, а не в разрешении координатной сетки.<br>

    </div>
    <h3 class="sec">v2.8</h3>
    <div class="hint">
      · Дороги (⌇, клавиша O): обычные дороги четырёх классов — шоссе, дорога, грунтовая, тропа. Толщина и характер линии зависят от класса, цвет задаётся отдельно от державы. Точки ставятся свободно, но рядом с перекрёстком, городом или узлом снабжения прилипают к нему, так что сеть смыкается без зазоров. «Продолжить» достраивает существующую дорогу, «Развернуть» меняет направление.<br>
