<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВПИ · Штабная карта · v3.1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231c1f26'/><rect x='3.5' y='3.5' width='57' height='57' rx='8' fill='none' stroke='%238a7340' stroke-width='2'/><path d='M32 8 L37 27 L56 32 L37 37 L32 56 L27 37 L8 32 L27 27 Z' fill='%23c9a25a'/><path d='M32 8 L37 27 L32 32 Z' fill='%23e8d9a8'/><circle cx='32' cy='32' r='8.5' fill='%2314161a' stroke='%23c9a25a' stroke-width='2'/><text x='32' y='37.5' font-family='Georgia,serif' font-size='12' font-weight='bold' text-anchor='middle' fill='%23e8d9a8'>&#x412;</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231c1f26'/><rect x='3.5' y='3.5' width='57' height='57' rx='8' fill='none' stroke='%238a7340' stroke-width='2'/><path d='M32 8 L37 27 L56 32 L37 37 L32 56 L27 37 L8 32 L27 27 Z' fill='%23c9a25a'/><path d='M32 8 L37 27 L32 32 Z' fill='%23e8d9a8'/><circle cx='32' cy='32' r='8.5' fill='%2314161a' stroke='%23c9a25a' stroke-width='2'/><text x='32' y='37.5' font-family='Georgia,serif' font-size='12' font-weight='bold' text-anchor='middle' fill='%23e8d9a8'>&#x412;</text></svg>">
<meta name="theme-color" content="#1c1f26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="ВПИ">
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel2:#22262f; --line:#343a46;
    --ink:#e8e4d8; --ink-dim:#9aa0ad; --brass:#c9a25a; --brass-dim:#8a7340;
    --red:#b8503f; --green:#6f9d5f; --sky:#6fa8d8;
    --mono:"Consolas","JetBrains Mono","Courier New",monospace;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;overflow:hidden}
  /* приложение всегда занимает весь экран, что бы ни попало в разметку выше него */
  body{position:relative}
  #app{position:absolute;inset:0}
  button{font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:5px 10px;cursor:pointer;border-radius:2px}
  button:hover{border-color:var(--brass);color:var(--brass)}
  button.primary{background:var(--brass);color:#14161a;border-color:var(--brass);font-weight:bold}
  button.primary:hover{background:#dbb56d;color:#14161a}
  button.danger:hover{border-color:var(--red);color:var(--red)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  input,select,textarea{font-family:var(--mono);font-size:12px;background:#15181d;color:var(--ink);border:1px solid var(--line);padding:5px 7px;border-radius:2px;width:100%}
  textarea{resize:vertical;min-height:52px;line-height:1.5}
  label{display:block;color:var(--ink-dim);font-size:11px;margin:9px 0 3px;text-transform:uppercase;letter-spacing:.06em}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:flex;flex-direction:column;height:100%;min-height:0;z-index:1;background:var(--bg)}
  #topbar{display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;flex-wrap:wrap;flex:0 0 auto;row-gap:6px}
  #topbar button,#topbar select{white-space:nowrap;flex:0 0 auto}
  #topbar .title{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--brass);text-transform:uppercase;white-space:nowrap}
  #topbar .role-badge{font-size:11px;border:1px solid var(--brass-dim);color:var(--brass);padding:2px 8px;border-radius:2px;letter-spacing:.08em}
  .sep{width:1px;align-self:stretch;background:var(--line)}
  #main{flex:1 1 auto;display:flex;min-height:0;min-width:0}

  #toolbar{flex:0 0 52px;width:52px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;gap:6px;overflow-y:auto;overflow-x:hidden}
  .tool{flex:0 0 auto}
  .tool{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;border-radius:3px;user-select:none}
  .tool:hover{border-color:var(--brass)}
  .tool.active{background:var(--brass);color:#14161a;border-color:var(--brass)}

  #viewport{flex:1 1 auto;position:relative;overflow:hidden;background:#0d0f12;cursor:grab;min-width:0;min-height:0;
    user-select:none;-webkit-user-select:none;-ms-user-select:none;-webkit-touch-callout:none;touch-action:none}
  #viewport *{user-select:none;-webkit-user-select:none}
  #world,#overlay{user-select:none;-webkit-user-select:none}
  #overlay text{user-select:none;-webkit-user-select:none;pointer-events:none}
  #viewport.drawing{cursor:crosshair}
  #viewport.panning{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0}
  #world img{display:block;user-select:none;pointer-events:none;-webkit-user-drag:none;position:absolute;top:0;left:0}
  /* резкость подложки: при увеличении не мылим, при уменьшении сглаживаем */
  #world img.crisp{image-rendering:pixelated;image-rendering:crisp-edges}
  #world img.smooth{image-rendering:auto}
  #world{transform-origin:0 0}
  #overlay,#overlay2{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}
  #overlay.fast,#overlay2.fast{shape-rendering:optimizeSpeed;text-rendering:optimizeSpeed}
  #mapImg{position:relative !important}
  #overlay,#overlay2{position:absolute;top:0;left:0}
  #overlay2{pointer-events:none}
  #nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:14px;text-align:center;line-height:2}

  #inspector{flex:0 0 320px;width:320px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  /* доступ по роли - только классом, инлайновые стили больше не трогаем */
  body:not(.is-gm) .gm-only{display:none !important}
  @media (max-width:1000px){
    #inspector{position:absolute;right:0;top:0;bottom:0;z-index:40;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
    #main{position:relative}
  }
  @media (max-width:640px){ #inspector{width:min(320px,92vw);flex-basis:auto} }
  #inspector.hidden{display:none}
  #insHead{padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--serif);letter-spacing:.08em;color:var(--brass);text-transform:uppercase;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  #insBody{flex:1;overflow-y:auto;padding:12px 14px 24px}
  .card{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brass);padding:10px 12px;margin-bottom:10px}
  .card h4{font-family:var(--serif);font-size:14px;color:var(--ink);margin-bottom:4px}
  .card .sub{color:var(--ink-dim);font-size:11px;margin-bottom:6px}
  .card pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--ink)}
  .secret{border-left-color:var(--red)}
  .secret h4{color:#d98f83}
  .btnrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .checkrow{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px;color:var(--ink)}
  .checkrow input{width:auto}

  #statusbar{background:var(--panel);border-top:1px solid var(--line);padding:4px 12px;display:flex;gap:16px;color:var(--ink-dim);font-size:11px}
  #statusbar b{color:var(--brass);font-weight:normal}

  .modal-back{position:fixed;inset:0;background:rgba(8,9,11,.82);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:var(--panel);border:1px solid var(--brass-dim);width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal .mhead{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);display:flex;justify-content:space-between}
  .modal .mbody{padding:16px 18px;overflow-y:auto}
  .modal .mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .modal .close{cursor:pointer;color:var(--ink-dim)}
  .modal .close:hover{color:var(--red)}
  .list-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .list-row input,.list-row select{flex:1}
  .list-row input[type=color]{flex:0 0 40px;height:29px;padding:2px}
  .list-row button{flex:0 0 auto}
  .resgrid{display:grid;grid-template-columns:1fr 58px;gap:3px 8px;align-items:center;margin-top:4px}
  .resgrid span{font-size:11px;color:var(--ink)}
  .resgrid input{padding:3px 5px;text-align:right}
  .warrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-left:3px solid var(--brass);padding:8px 10px;margin-bottom:8px;cursor:pointer}
  .warrow:hover{border-color:var(--brass)}
  .warrow b{font-family:var(--serif);font-size:13px}
  .warrow .s{color:var(--ink-dim);font-size:11px}
  .balance{height:8px;display:flex;border:1px solid var(--line);margin:6px 0;border-radius:2px;overflow:hidden}
  .balance i{display:block;height:100%}
  .pill{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:2px;padding:1px 6px;margin-right:4px;color:var(--ink-dim)}
  .pill.hot{border-color:var(--red);color:#d98f83}
  .pill.pocket{border-color:#d8b45a;color:#d8b45a}
  #previewBar{position:absolute;left:0;right:0;top:0;background:rgba(184,80,63,.92);color:#fff;
    font-size:12px;padding:5px 12px;z-index:30;display:none;justify-content:space-between;align-items:center}
  #previewBar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
  .statgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:7px 6px;text-align:center}
  .statgrid b{display:block;font-family:var(--serif);font-size:16px;color:var(--brass);line-height:1.2}
  .statgrid b.ok{color:var(--green)} .statgrid b.warn{color:#d8b45a} .statgrid b.bad{color:var(--red)}
  .statgrid span{display:block;font-size:10px;color:var(--ink-dim);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
  .eqgrid{display:grid;grid-template-columns:1fr 58px 46px;gap:3px 8px;align-items:center;margin-top:4px}
  .eqgrid span{font-size:11px;color:var(--ink)}
  .eqgrid .lim{color:var(--ink-dim);font-size:11px;text-align:left}
  .eqgrid input{padding:3px 5px;text-align:right}
  .ledger{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  .ledger th{color:var(--ink-dim);font-weight:normal;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
  .ledger td{padding:2px 4px;border-bottom:1px solid #2a2f38}
  .ledger td input{padding:2px 5px;text-align:right;width:70px}
  .ledger .numc{text-align:right;font-variant-numeric:tabular-nums}
  .ledger .plus{color:var(--green)} .ledger .minus{color:var(--red)}
  .restab{width:100%;border-collapse:collapse;font-size:12px;margin:2px 0}
  .restab td{padding:2px 0;border-bottom:1px solid var(--line)}
  .restab td:last-child{text-align:right;color:var(--brass)}
  .hint{color:var(--ink-dim);font-size:11px;line-height:1.6;margin-top:8px}
  h3.sec{font-family:var(--serif);color:var(--brass);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}

  #login .stamp{font-family:var(--serif);text-align:center;margin:6px 0 18px}
  #login .stamp .big{font-size:26px;letter-spacing:.3em;color:var(--brass);text-transform:uppercase}
  #login .stamp .small{font-size:11px;letter-spacing:.35em;color:var(--ink-dim);text-transform:uppercase;margin-top:4px}
  #login .stamp .frame{display:inline-block;border:2px solid var(--brass-dim);padding:14px 34px;position:relative}
  #login .stamp .frame:after{content:"";position:absolute;inset:3px;border:1px solid var(--brass-dim);pointer-events:none}
  .bigbtn{display:block;width:100%;padding:13px;margin-bottom:10px;font-size:13px;letter-spacing:.06em;text-align:left}
  .bigbtn small{display:block;color:var(--ink-dim);margin-top:3px;letter-spacing:0}
  .bigbtn:hover small{color:inherit}

  #toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--brass);color:var(--ink);padding:8px 18px;border-radius:2px;z-index:200;display:none;font-size:12px}
  @media (prefers-reduced-motion:no-preference){ #toast{transition:opacity .3s} }

  /* ---- v3.1: плавность, подсказки, навигация ---- */
  button,.tool,select,input,textarea{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .12s}
  .tool:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .tool:active,button:active{transform:scale(.96)}
  @media (prefers-reduced-motion:no-preference){
    .modal-back{animation:fadeIn .16s ease-out}
    .modal{animation:popIn .22s cubic-bezier(.2,.8,.3,1)}
    #inspector:not(.hidden){animation:slideIn .22s cubic-bezier(.2,.8,.3,1)}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .modal.wide{width:min(940px,96vw)}
  #tip{position:fixed;z-index:300;max-width:320px;background:rgba(16,18,22,.97);border:1px solid var(--brass-dim);color:var(--ink);
    font-size:11px;line-height:1.5;padding:6px 9px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;
    opacity:0;transform:translateY(3px);transition:opacity .14s,transform .14s;left:0;top:0}
  #tip.on{opacity:1;transform:none}
  #tip .t-h{font-family:var(--serif);color:var(--brass);font-size:12px;margin:4px 0 2px}
  #tip .t-h:first-child{margin-top:0}
  #tip table{border-collapse:collapse;width:100%} #tip td{padding:0 6px 0 0;vertical-align:top} #tip td.n{text-align:right;font-variant-numeric:tabular-nums;padding:0}
  #tip .plus{color:var(--green)} #tip .minus{color:#d98f83} #tip .dim{color:var(--ink-dim)}
  #tip kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:5px;color:var(--brass)}
  #provCard{position:absolute;top:10px;right:10px;z-index:20;min-width:190px;max-width:270px;background:rgba(20,22,26,.94);
    border:1px solid var(--line);border-left:3px solid var(--brass);padding:8px 11px;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    pointer-events:none;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
  #provCard.on{opacity:1;transform:none}
  #provCard h4{font-family:var(--serif);font-size:14px;margin-bottom:2px}
  #provCard .s{color:var(--ink-dim);font-size:11px;line-height:1.55}
  #provCard i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:0}
  #navbox{position:absolute;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:4px;align-items:center}
  #navbox button{width:34px;height:34px;padding:0;font-size:16px;background:rgba(28,31,38,.92);border-radius:4px;line-height:1}
  #navbox .zl{font-size:10px;color:var(--ink-dim);text-align:center;background:rgba(20,22,26,.8);padding:1px 4px;border-radius:2px}
  #minimap{position:absolute;left:12px;bottom:12px;z-index:20;border:1px solid var(--brass-dim);background:#0d0f12;
    box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:crosshair;border-radius:3px;opacity:.9;transition:opacity .15s;display:none;touch-action:none}
  #minimap:hover{opacity:1}
  .pool{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  .pool th{color:var(--ink-dim);font-weight:normal;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .pool th:first-child{text-align:left}
  .pool td{padding:2px 4px;border-bottom:1px solid #2a2f38;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pool td:first-child{text-align:left;white-space:normal}
  .pool tr[data-tipres]{cursor:help}
  .pool tr[data-tipres]:hover td{background:#2a2f38}
  .pool .grp td{color:var(--brass);font-family:var(--serif);text-transform:uppercase;letter-spacing:.08em;padding-top:9px;text-align:left;cursor:default;background:none !important}
  .pool .plus{color:var(--green)} .pool .minus{color:#d98f83} .pool .dim{color:var(--ink-dim)}
  .pool input{padding:2px 4px;text-align:right;width:64px}
  .rowx{display:flex;gap:5px;align-items:center;margin-bottom:4px}
  .rowx input,.rowx select{flex:1;min-width:0}
  .rowx .q{flex:0 0 66px;text-align:right}
  .rowx button{flex:0 0 auto;padding:3px 8px}
  .rowx .lbl{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowx .io{flex:0 0 auto;font-size:10px;color:var(--ink-dim)}
  .rcard{background:var(--panel2);border:1px solid var(--line);padding:8px 10px;margin-bottom:8px;border-radius:2px}
  .rcard h4{font-family:var(--serif);font-size:13px;margin-bottom:6px;color:var(--ink)}
  .rcard .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rcard .cap{color:var(--ink-dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .econlog .plus{color:var(--green)} .econlog .minus{color:#d98f83}
  #toast{box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">ВПИ · Штабная карта</span>
    <span class="role-badge" id="roleBadge">—</span>
    <div class="sep"></div>
    <select id="mapMode" style="width:auto" title="Режим карты">
      <option value="political">Политическая</option>
      <option value="physical">Физическая</option>
      <option value="biome">Экосистемы</option>
    </select>
    <button id="btnUnderlay" title="Подложки режимов">🗺 Фоны</button>
    <button id="btnLayers" title="Какие слои карты показывать: границы, войска, дороги, области, миникарта">Слои ▾</button>
    <div class="sep"></div>
    <button id="btnSave" title="Ctrl+S — записать в тот же файл">💾 Сохранить</button>
    <button id="btnSaveAs" title="Сохранить в новый файл">Сохранить как…</button>
    <span id="dirtyMark" style="color:var(--brass);font-size:11px;display:none">● не сохранено</span>
    <button id="btnSnapshot" title="Сохранить карту в изображение в полном разрешении">📷 Снимок</button>
    <button id="btnEcon" title="Экономика государства: запасы, добыча, заводы, баланс за год">💰 Экономика</button>
    <button id="btnExport" class="gm-only" title="Выгрузить персональный файл игрока — всё скрытое от него вырезано">📦 Сборка игроку</button>
    <button id="btnWar" class="gm-only" title="Театры военных действий: баланс сил, фронт, котлы">⚔ Война</button>
    <button id="btnTools" class="gm-only" title="Инструменты ГМа: поиск, кубик, взгляд игрока, «Прошёл год»">🧰 Инструменты</button>
    <button id="btnCountry" class="gm-only" title="Панель страны: войска, штаты, снаряжение, сверка со стат-листом">🏛 Страна</button>
    <button id="btnSettings" class="gm-only" title="Настройки партии: карта, государства, игроки, размеры значков">⚙ Настройки</button>
    <button id="btnReset" title="Вернуть панели, слои и масштаб в исходное состояние">⟲ Сброс</button>

/* старое поле «Производство ресурсов» превращается в добывающие точки */
function legacyMines(st){
  const out=[];
  for(const [k,v] of Object.entries(st?.resv||{})){
    const n=num0(v)||parseFloat(String(v).replace(",","."))||0;
    if(n>0) out.push({id:uid(),name:String(n)===String(v).trim()?"Добыча":"Добыча ("+v+")",res:k,amt:n});
  }
  return out;
}
/* ---- миграция сохранений v1.0 → v1.1: вся старая работа остаётся ---- */
const num0=v=>{const m=String(v??"").match(/-?\d+/);return m?parseInt(m[0]):0;};
function migrate(d){
  d.meta = d.meta||{};
  d.meta.underlayHints = d.meta.underlayHints||{};
  d.meta.iconScale = Object.assign({div:100,city:100,struct:100,dep:100,rail:100,road:100}, d.meta.iconScale||{});
  d.meta.defRadius = Object.assign({supply:600,air:900}, d.meta.defRadius||{});
  d.meta.hideDivLabels = Array.isArray(d.meta.hideDivLabels)?d.meta.hideDivLabels:[];  /* державы, чьи соединения без подписей */
  d.meta.version = DATA_VER;
  d.nations=d.nations||[]; d.players=d.players||[];
  d.provinces=(d.provinces||[]).map(p=>({
    id:p.id||uid(), name:p.name||"Провинция", points:p.points||[], nationId:p.nationId||null,
    vis:p.vis??"all",
    stats:{
      pop:p.stats?.pop||"",
      resv:{},
      mines:Array.isArray(p.stats?.mines)?p.stats.mines.map(m=>({id:m.id||uid(),name:m.name||"",res:m.res||"coal",amt:+m.amt||0}))
            :legacyMines(p.stats),
      fabs:Array.isArray(p.stats?.fabs)?p.stats.fabs.filter(f=>f&&f.type).map(f=>({type:f.type,count:String(f.count??1)})):[],
      fab:p.stats?.fab||"",
      notes:(p.stats?.notes||"") + (p.stats?.res?((p.stats?.notes?"\n":"")+"Ресурсы (из старой версии):\n"+p.stats.res):"")
    },
    secret:p.secret||"", secretVis:Array.isArray(p.secretVis)?p.secretVis:[]
  }));
  d.cities=(d.cities||[]).map(c=>({id:c.id||uid(),name:c.name||"Город",x:c.x||0,y:c.y||0,size:c.size||"city",vis:c.vis??"all",noShot:!!c.noShot}));
  d.divisions=(d.divisions||[]).map(x=>({id:x.id||uid(),name:x.name||"Дивизия",type:x.type||"inf",x:x.x||0,y:x.y||0,
    nationId:x.nationId||null,strength:x.strength||"",training:x.training||"средняя",
    quality:x.quality||"none", eq:x.eq||{}, ships:x.ships||{}, vis:x.vis??"owner"}));

  const legacyAir=d.divisions.filter(x=>x.type==="air");

    d.structures=d.structures||[];
    for(const a of legacyAir){
      d.structures.push({id:uid(),name:a.name,type:"air",x:a.x,y:a.y,nationId:a.nationId,
        radius:(d.meta.defRadius?.air||150),

        notes:a.strength||"", vis:a.vis||"owner"});
    }
    d.divisions=d.divisions.filter(x=>x.type!=="air");
  }
  d.divisions.forEach(x=>{ if(x.eq) delete x.eq.plane; });
  (d.templates||[]).forEach(t=>{ if(t.limits) delete t.limits.plane; });
  d.templates=(d.templates||[]).filter(t=>t.type!=="air");
  d.deposits=(d.deposits||[]).map(x=>({id:x.id||uid(),name:x.name||"Месторождение",type:x.type||"coal",size:x.size||"mid",
    x:x.x||0,y:x.y||0,nationId:x.nationId||null,output:x.output||"",notes:x.notes||"",vis:x.vis??"owner",noShot:!!x.noShot}));
  d.rails=(d.rails||[]).map(r=>({id:r.id||uid(),name:r.name||"Ветка",nationId:r.nationId||null,pts:r.pts||[],vis:r.vis??"all"}));

    color:r.color||ROAD_COLOR,nationId:r.nationId||null,pts:r.pts||[],note:r.note||"",vis:r.vis??"all"}));
  d.zones=(d.zones||[]).map(z=>({id:z.id||uid(),name:z.name||"Область",points:z.points||[],
    color:z.color||"#c9a25a",angle:z.angle??45,gap:z.gap??120,thick:z.thick??30,fillOp:z.fillOp??8,

    color:a.color||"#c9a25a",width:a.width??100,style:a.style||"solid",head:a.head||"end",

    nationId:a.nationId||null,note:a.note||"",vis:a.vis??"all",noShot:!!a.noShot}));
  d.divisions=(d.divisions||[]).map(x=>(x.noShot=!!x.noShot,x));
  d.templates=(d.templates||[]).map(t=>({id:t.id||uid(),nationId:t.nationId||null,type:t.type||"inf",limits:t.limits||{}}));
  d.stocks=d.stocks||{}; d.stocks.res=d.stocks.res||{}; d.stocks.eq=d.stocks.eq||{};
  d.statRef=d.statRef||{};   /* эталон из скрытой статистики Discord */

    nationId:s.nationId||null,radius:+s.radius||150,planes:s.planes||{},notes:s.notes||"",vis:s.vis??"all",noShot:!!s.noShot}));
  /* экономика: цепочки заводов, настройки государств, журнал лет */
  const e=d.econ=d.econ||{};
  e.year=+e.year||1;
  const rc=JSON.parse(JSON.stringify(DEF_RECIPES));
  for(const [k,r] of Object.entries(e.recipes||{})) rc[k]={in:{...(r?.in||{})},out:{...(r?.out||{})}};
  e.recipes=rc;
  const nat={};
  for(const [k,v] of Object.entries(e.nat||{}))
    nat[k]={cap:v?.cap||null,mods:v?.mods||{},need:v?.need||{},adds:Array.isArray(v?.adds)?v.adds.map(a=>({id:a.id||uid(),res:a.res||"coal",amt:+a.amt||0,note:a.note||""})):[]};
  e.nat=nat;
  e.log=Array.isArray(e.log)?e.log:[];
  return d;
}

/* =============================================================
   ЭКОНОМИКА
   Итог за год по каждому ресурсу:
     (добыча + выпуск заводов) × (1 + модификатор %)
     + прибавки − потребление заводов − снабжение
   Запасы: винтовки, орудия, доп. оснащение, танки и машины лежат
   в снаряжении страны (их раздаёт панель «Страна»), прочее — в ресурсах.
   ============================================================= */
const EQ_KEYS=new Set(["rifle","art","gear","tank","truck"]);
const rnd=v=>Math.round((+v||0)*100)/100;
const fmtN=v=>rnd(v).toLocaleString("ru");
const pmN=v=>(v>0?"+":v<0?"−":"")+fmtN(Math.abs(v));
const sgnC=v=>v>0?"plus":v<0?"minus":"dim";
function econNat(nid,create){
  let e=data.econ.nat[nid];
  if(!e&&create) e=data.econ.nat[nid]={cap:null,mods:{},need:{},adds:[]};
  return e||{cap:null,mods:{},need:{},adds:[]};
}
const stockRaw=(nid,k)=>((EQ_KEYS.has(k)?data.stocks?.eq:data.stocks?.res)||{})[nid]?.[k]??"";
const stockGet=(nid,k)=>num(stockRaw(nid,k));
function stockSet(nid,k,v){
  const box=EQ_KEYS.has(k)?"eq":"res";
  data.stocks=data.stocks||{res:{},eq:{}}; data.stocks[box]=data.stocks[box]||{};
  const b=data.stocks[box][nid]||(data.stocks[box][nid]={});
  if(v===""||v==null)delete b[k]; else b[k]=String(v);
}
/* столица экономики: назначенная ГМом провинция → провинция со столичным городом → самая крупная */
function econCap(nid){
  if(!nid)return null;
  const provs=data.provinces.filter(p=>p.nationId===nid&&p.points.length>2);
  if(!provs.length)return null;
  const set=data.econ.nat[nid]?.cap;
  if(set){const p=provs.find(p=>p.id===set); if(p)return p;}
  for(const c of data.cities){
    if(c.size!=="capital")continue;
    const p=provs.find(p=>{const b=pbox(p);return c.x>=b[0]&&c.x<=b[2]&&c.y>=b[1]&&c.y<=b[3]&&ptIn(p.points,c.x,c.y);});
    if(p)return p;
  }
  let best=null,ba=-1;
  for(const p of provs){const a=polyArea(p.points); if(a>ba){ba=a;best=p;}}
  return best;
}
const facLabel=t=>{const f=FACTORIES.find(x=>x[0]===t);return f?f[2]+" "+f[1]:t;};
const recipeText=t=>{
  const r=data.econ.recipes[t]; if(!r)return "";
  const side=o=>Object.entries(o||{}).filter(([,q])=>+q).map(([k,q])=>fmtN(q)+" "+resName(k).toLowerCase()).join(", ");
  return (side(r.in)||"ничего")+" → "+(side(r.out)||"ничего")+" в год";
};
function econCalc(nid){
  const R={};
  const row=k=>R[k]||(R[k]={mine:0,fout:0,fin:0,mod:0,add:0,need:0,prod:0,net:0,stock:0,src:[],dst:[]});
  for(const p of data.provinces){
    if(p.nationId!==nid)continue;
    for(const m of (p.stats.mines||[])){
      const a=+m.amt||0; if(!a)continue;
      const r=row(m.res); r.mine+=a; r.src.push(["⛏ "+(m.name||"Добыча")+" · "+p.name,a]);
    }
    for(const f of (p.stats.fabs||[])){
      const n=num(f.count), rec=data.econ.recipes[f.type]; if(!n||!rec)continue;
      const lbl=facLabel(f.type)+(n>1?" ×"+n:"")+" · "+p.name;
      for(const [k,q] of Object.entries(rec.out||{})){ if(!+q)continue; const r=row(k); r.fout+=q*n; r.src.push([lbl,q*n]); }
      for(const [k,q] of Object.entries(rec.in||{})){ if(!+q)continue; const r=row(k); r.fin+=q*n; r.dst.push([lbl,q*n]); }
    }
  }
  /* месторождения на карте тоже дают добычу, если ГМ не спрятал их от всех */
  for(const dp of (data.deposits||[])){
    if(dp.nationId!==nid||dp.vis==="gm"||!RAW_RES.includes(dp.type))continue;
    const a=num(dp.output); if(!a)continue;
    const r=row(dp.type); r.mine+=a; r.src.push(["◆ Месторождение "+dp.name,a]);
  }
  const e=econNat(nid);
  for(const [k,v] of Object.entries(e.mods||{})) if(num(v)) row(k).mod=num(v);
  for(const a of (e.adds||[])){
    const v=+a.amt||0; if(!v)continue;
    const r=row(a.res); r.add+=v; (v>0?r.src:r.dst).push(["⇄ "+(a.note||"Прибавка"),Math.abs(v)]);
  }
  for(const [k,v] of Object.entries(e.need||{})) if(num(v)){ const r=row(k); r.need=num(v); r.dst.push(["⚑ Снабжение",r.need]); }
  for(const [k] of ECON_RES) if(stockGet(nid,k)) row(k);
  for(const k in R){
    const r=R[k];
    r.stock=stockGet(nid,k);
    r.prod=(r.mine+r.fout)*(1+r.mod/100);
    r.net=rnd(r.prod+r.add-r.fin-r.need);
  }
  return R;
}
/* подсказка по ресурсу: откуда приходит, куда уходит, как считается */
function resTipHtml(nid,k){
  if(!data||!canSeeNationEcon(nid))return "";
  const r=econCalc(nid)[k]; if(!r)return "";
  const li=(arr,cls)=>arr.slice(0,10).map(([l,v])=>`<tr><td>${esc(l)}</td><td class="n ${cls}">${cls==="plus"?"+":"−"}${fmtN(v)}</td></tr>`).join("")
    +(arr.length>10?`<tr><td class="dim">…и ещё ${arr.length-10}</td><td></td></tr>`:"");
  const parts=[`добыча ${fmtN(r.mine)}`,`заводы ${fmtN(r.fout)}`];
  return `<div class="t-h">${esc(resName(k))}</div>
    <div class="t-h">Откуда приходит</div>${r.src.length?`<table>${li(r.src,"plus")}</table>`:'<div class="dim">ниоткуда</div>'}
    <div class="t-h">Куда уходит</div>${r.dst.length?`<table>${li(r.dst,"minus")}</table>`:'<div class="dim">никуда</div>'}
    <div class="t-h">Баланс за год</div>
    <div>(${parts.join(" + ")})${r.mod?` × ${rnd(1+r.mod/100)} <span class="dim">(модификатор ${pmN(r.mod)}%)</span>`:""}
      ${r.add?` ${r.add>0?"+":"−"} прибавки ${fmtN(Math.abs(r.add))}`:""} − потребление ${fmtN(r.fin)} − снабжение ${fmtN(r.need)}
      = <b class="${sgnC(r.net)}">${pmN(r.net)||"0"}</b></div>
    <div class="dim">Запас ${fmtN(r.stock)} → через год ${fmtN(Math.max(0,r.stock+r.net))}${r.stock+r.net<0?` <span class="minus">(нехватка ${fmtN(-(r.stock+r.net))})</span>`:""}</div>`;
}
/* таблица пула: компактная (карточка провинции) или полная (окно экономики, edit — поля ГМа) */
function poolTable(nid,opt={}){
  const R=econCalc(nid), ed=!!opt.edit, full=!!opt.full, e=econNat(nid);
  const show=k=>{const r=R[k]; return opt.all||(r&&(r.stock||r.net||r.prod||r.fin||r.need||r.add||r.mod));};
  const cols=full?10:4;
  let h=`<table class="pool"><tr><th>Ресурс</th><th>Запас</th>`+
    (full?`<th>Добыча</th><th>Заводы +</th><th>Заводы −</th><th>Мод. %</th><th>Прибавки</th>`:"")+
    `<th>Снабж.</th><th>Итог/год</th>`+(full?`<th>Через год</th>`:"")+`</tr>`;
  let any=false;
  for(const [g,gn] of ECON_GROUPS){
    const ks=ECON_RES.filter(r=>r[2]===g&&show(r[0]));
    if(!ks.length)continue; any=true;
    h+=`<tr class="grp"><td colspan="${cols}">${gn}</td></tr>`;
    for(const [k,n] of ks){
      const r=R[k]||{stock:0,mine:0,fout:0,fin:0,mod:0,add:0,need:0,net:0};
      h+=`<tr data-tipres="${nid}|${k}" data-k="${k}"><td>${n}</td>`+
        `<td>${ed?`<input data-est="${k}" value="${esc(stockRaw(nid,k))}" placeholder="0">`:fmtN(r.stock)}</td>`+
        (full?`<td data-c="mine">${r.mine?fmtN(r.mine):"—"}</td><td data-c="fout" class="plus">${r.fout?"+"+fmtN(r.fout):"—"}</td>`+
          `<td data-c="fin" class="minus">${r.fin?"−"+fmtN(r.fin):"—"}</td>`+
          `<td>${ed?`<input data-emod="${k}" value="${esc(e.mods?.[k]??"")}" placeholder="0">`:(r.mod?pmN(r.mod)+"%":"—")}</td>`+
          `<td data-c="add" class="${sgnC(r.add)}">${r.add?pmN(r.add):"—"}</td>`:"")+
        `<td>${ed?`<input data-eneed="${k}" value="${esc(e.need?.[k]??"")}" placeholder="0">`:(r.need?fmtN(r.need):"—")}</td>`+
        `<td data-c="net" class="${sgnC(r.net)}">${pmN(r.net)||"0"}</td>`+
        (full?`<td data-c="next" class="${r.stock+r.net<0?"minus":""}">${fmtN(Math.max(0,r.stock+r.net))}</td>`:"")+`</tr>`;
    }
  }
  if(!any) return '<div class="hint">Ресурсов пока нет: добывающие точки и заводы ставятся в провинциях государства, запасы вписывает ГМ.</div>';
  return h+"</table>";
}
/* живое обновление вычисляемых ячеек без перерисовки полей ввода */
function refreshPool(box,nid){
  const R=econCalc(nid);
  box.querySelectorAll("tr[data-k]").forEach(tr=>{
    const r=R[tr.dataset.k]||{mine:0,fout:0,fin:0,add:0,net:0,stock:0};
    const set=(c,t,cls)=>{const td=tr.querySelector(`[data-c="${c}"]`); if(td){td.textContent=t; if(cls!==undefined)td.className=cls;}};
    set("mine",r.mine?fmtN(r.mine):"—"); set("fout",r.fout?"+"+fmtN(r.fout):"—"); set("fin",r.fin?"−"+fmtN(r.fin):"—");
    set("add",r.add?pmN(r.add):"—",sgnC(r.add)); set("net",pmN(r.net)||"0",sgnC(r.net));
    set("next",fmtN(Math.max(0,r.stock+r.net)),r.stock+r.net<0?"minus":"");
  });
}

  const r=vp.getBoundingClientRect();

/* колесо и щипок на тачпаде: цель масштаба копится, карта плавно доезжает до неё */
vp.addEventListener("wheel",e=>{

/* ---- плавная прокрутка карты, когда курсор у края экрана ---- */
let edgeVec={x:0,y:0};
function updateEdge(e){
  if(!layers.edgeScroll||!mapLoaded){edgeVec.x=edgeVec.y=0;return;}
  const r=vp.getBoundingClientRect(), M=34, V=0.32; /* px/мс на самом краю */
  const dl=e.clientX-r.left, dr=r.right-e.clientX, dt=e.clientY-r.top, db=r.bottom-e.clientY;
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){edgeVec.x=edgeVec.y=0;return;}
  const ease=d=>Math.pow(Math.max(0,(M-d)/M),1.6)*V;
  edgeVec.x=(dl<M?ease(dl):0)-(dr<M?ease(dr):0);
  edgeVec.y=(dt<M?ease(dt):0)-(db<M?ease(db):0);
}
document.addEventListener("pointermove",updateEdge);
vp.addEventListener("pointerleave",()=>{edgeVec.x=edgeVec.y=0;});
let _lastT=0;
const keysDown=new Set();
function edgeLoop(t){
  const dt=Math.min(50,t-_lastT||16); _lastT=t;
  if((edgeVec.x||edgeVec.y)&&!panState&&!$("#modals").firstElementChild){
    view.x+=edgeVec.x*dt; view.y+=edgeVec.y*dt; applyView(); schedulePanRedraw();
  }
  /* стрелки: плавная прокрутка, пока клавиша зажата; Shift — быстрее */
  if(keysDown.size&&mapLoaded){
    const v=(keysDown.has("Shift")?1.6:0.7)*dt;
    const kx=(keysDown.has("ArrowLeft")?1:0)-(keysDown.has("ArrowRight")?1:0);
    const ky=(keysDown.has("ArrowUp")?1:0)-(keysDown.has("ArrowDown")?1:0);
    if(kx||ky){fly=null;view.x+=kx*v;view.y+=ky*v;applyView();setMoving(true);schedulePanRedraw();}
  }
  if(zAnim&&mapLoaded){
    let ns=view.s*Math.pow(zAnim.s/view.s,Math.min(1,dt/65));
    if(Math.abs(Math.log(zAnim.s/ns))<0.004)ns=zAnim.s;
    view.s=ns; view.x=zAnim.cx-zAnim.w[0]*ns; view.y=zAnim.cy-zAnim.w[1]*ns;
    applyView(); setMoving(true); scheduleZoomRedraw();
    if(ns===zAnim.s)zAnim=null;
  }
  if(fly&&mapLoaded){
    const r=vp.getBoundingClientRect();
    const k=Math.min(1,(t-fly.t0)/fly.dur), q=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    const s=Math.exp(Math.log(fly.s0)+(Math.log(fly.s1)-Math.log(fly.s0))*q);
    const cx=fly.c0[0]+(fly.c1[0]-fly.c0[0])*q, cy=fly.c0[1]+(fly.c1[1]-fly.c0[1])*q;
    view.s=s; view.x=r.width/2-cx*s; view.y=r.height/2-cy*s;
    applyView(); setMoving(true);
    if(k>=1){fly=null;render();} else scheduleZoomRedraw();
  }
  requestAnimationFrame(edgeLoop);
}
/* ---- плавное приближение и перелёты ---- */
let zAnim=null, fly=null;
const clampS=s=>Math.min(8,Math.max(0.02,s));
function zoomBy(k,cx,cy){
  if(!mapLoaded)return;
  const r=vp.getBoundingClientRect();
  if(cx==null){cx=r.width/2;cy=r.height/2;}
  fly=null;
  const s0=zAnim?zAnim.s:view.s;
  zAnim={s:clampS(s0*k),cx,cy,w:[(cx-view.x)/view.s,(cy-view.y)/view.s]};
}
function flyTo(x,y,s,dur){
  if(!mapLoaded)return;
  const r=vp.getBoundingClientRect();
  zAnim=null; s=clampS(s||view.s);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)dur=0;
  if(dur===0){view.s=s;view.x=r.width/2-x*s;view.y=r.height/2-y*s;fly=null;applyView();render();return;}
  fly={t0:performance.now(),dur:dur||420,c0:[(r.width/2-view.x)/view.s,(r.height/2-view.y)/view.s],s0:view.s,c1:[x,y],s1:s};
}
function flyToBox(b,pad){
  const r=vp.getBoundingClientRect();
  const s=Math.min(r.width/Math.max(1,b[2]-b[0]),r.height/Math.max(1,b[3]-b[1]))*(pad||0.8);
  flyTo((b[0]+b[2])/2,(b[1]+b[3])/2,s);
}

function focusSelection(){
  if(!selection||!data)return false;
  const s=selection, L={province:"provinces",zone:"zones",theatre:"theatres",road:"roads",arrow:"arrows",rail:"rails",
    city:"cities",division:"divisions",structure:"structures",deposit:"deposits"}[s.kind];
  const o=L&&(data[L]||[]).find(x=>x.id===s.id); if(!o)return false;
  let pts=o.points||o.pts;

  if(pts&&pts.length){ const b=bboxOf(pts); if(b[2]-b[0]<30&&b[3]-b[1]<30)flyTo((b[0]+b[2])/2,(b[1]+b[3])/2,Math.max(view.s,0.8)); else flyToBox(b,0.7); }
  else flyTo(o.x,o.y,Math.max(view.s,0.8));
  return true;
}

const num = v => { const m=String(v??"").match(/-?\d+(?:[.,]\d+)?/); return m?parseFloat(m[0].replace(",",".")):0; };

  if(!t&&create){t={id:uid(),nationId:nid,type,limits:{}};data.templates.push(t);}
  return t;
}
function tplDefined(t){ return !!t && EQUIP.some(([k])=>num(t.limits?.[k])>0); }
/* null — штат не задан (без ограничений); 0 — не положено по штату; >0 — лимит */
function divCap(d,key){
  const t=getTemplate(d.nationId,d.type);
  if(!tplDefined(t)) return null;
  const v=num(t.limits[key]);
  return v>0?v:0;
}

/* ---- железные дороги: узлы, прилипание, завершение ---- */
function railSnap(x,y,target){
  const g = target&&target.closest ? target.closest("[data-kind='city'],[data-kind='structure']") : null;
  if(g) return {k:g.dataset.kind==="city"?"city":"struct", id:g.dataset.id};
  const R = 14/view.s; let best=null,bd=R;
  for(const c of data.cities){const d=Math.hypot(c.x-x,c.y-y); if(d<bd){bd=d;best={k:"city",id:c.id};}}
  for(const st of data.structures){const d=Math.hypot(st.x-x,st.y-y); if(d<bd){bd=d;best={k:"struct",id:st.id};}}
  return best || {k:"xy",x:Math.round(x),y:Math.round(y)};
}
function railPoint(pt){
  if(pt.k==="city"){const c=data.cities.find(c=>c.id===pt.id); return c?[c.x,c.y]:null;}
  if(pt.k==="struct"){const st=data.structures.find(s=>s.id===pt.id); return st?[st.x,st.y]:null;}
  return [pt.x,pt.y];
}
function railLabel(pt){
  if(pt.k==="city")return data.cities.find(c=>c.id===pt.id)?.name||"город";
  if(pt.k==="struct")return data.structures.find(s=>s.id===pt.id)?.name||"узел";
  return "точка";
}
/* ---- обычные дороги: прилипание к перекрёсткам и городам ---- */
function roadSnap(x,y){
  const R=13/view.s; let best=null,bd=R;
  for(const rd of (data.roads||[])) for(const q of rd.pts){
    const d=Math.hypot(q[0]-x,q[1]-y); if(d<bd){bd=d;best=[q[0],q[1]];}
  }
  for(const c of data.cities){const d=Math.hypot(c.x-x,c.y-y); if(d<bd){bd=d;best=[c.x,c.y];}}
  for(const st of data.structures){const d=Math.hypot(st.x-x,st.y-y); if(d<bd){bd=d;best=[st.x,st.y];}}
  return best||[Math.round(x),Math.round(y)];
}

function weldTolerance(){ return Math.max(2,(img.naturalWidth||4000)/2000); }  /* ~4 px на карте 8000 */
function vgrid(provs,cell){
  const g=new Map();
  for(const p of provs)for(const q of p.points){
    const k=Math.floor(q[0]/cell)+","+Math.floor(q[1]/cell);
    let a=g.get(k); if(!a){a=[];g.set(k,a);} a.push({p,q});
  }
  return {g,cell};
}
function vnear(vg,x,y,R){
  const out=[],c=vg.cell;
  for(let i=Math.floor((x-R)/c);i<=Math.floor((x+R)/c);i++)
    for(let j=Math.floor((y-R)/c);j<=Math.floor((y+R)/c);j++){
      const a=vg.g.get(i+","+j); if(a)for(const v of a)out.push(v);
    }
  return out;
}
function dedupePoints(p){
  const out=[];
  for(const q of p.points){const l=out[out.length-1]; if(!l||l[0]!==q[0]||l[1]!==q[1])out.push(q);}
  if(out.length>2&&out[0][0]===out[out.length-1][0]&&out[0][1]===out[out.length-1][1])out.pop();
  p.points=out;
}
/* onlyId - сшить только эту провинцию с соседями; без него - всю карту */
function weldBorders(onlyId){
  const T=weldTolerance(), provs=data.provinces.filter(p=>p.points.length>2);
  if(!provs.length)return {moved:0,added:0};
  const targets = onlyId ? provs.filter(p=>p.id===onlyId) : provs;
  let moved=0, added=0;
  /* 1. вершины притягиваются к чужим вершинам */
  let vg=vgrid(provs,T*2);
  for(const p of targets)for(const q of p.points){
    let best=null,bd=T;
    for(const v of vnear(vg,q[0],q[1],T)){
      if(v.p===p)continue;
      const dd=Math.hypot(v.q[0]-q[0],v.q[1]-q[1]);
      if(dd<bd){bd=dd;best=v.q;}
    }
    if(best&&(q[0]!==best[0]||q[1]!==best[1])){q[0]=best[0];q[1]=best[1];moved++;}
  }
  for(const p of provs)dedupePoints(p);
  /* 2. чужие вершины вставляются в свои рёбра (T-стыки) */
  vg=vgrid(provs,T*2);
  const pass=(list)=>{
    for(const p of list){
      const src=p.points,out=[];
      for(let i=0;i<src.length;i++){
        const a=src[i],b=src[(i+1)%src.length];
        out.push(a);
        const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;
        if(!L2)continue;
        const L=Math.sqrt(L2),steps=Math.max(1,Math.ceil(L/(T*2)));
        const seen=new Set(),ins=[];
        for(let k=0;k<=steps;k++){
          const t=k/steps;
          for(const v of vnear(vg,a[0]+dx*t,a[1]+dy*t,T)){
            if(v.p===p)continue;
            const id=v.q[0]+","+v.q[1]; if(seen.has(id))continue; seen.add(id);
            const u=((v.q[0]-a[0])*dx+(v.q[1]-a[1])*dy)/L2;
            if(u<=0.002||u>=0.998)continue;
            if(Math.hypot(v.q[0]-(a[0]+dx*u),v.q[1]-(a[1]+dy*u))<=T)ins.push([u,v.q]);
          }
        }
        ins.sort((m,n)=>m[0]-n[0]);
        for(const [,q] of ins){
          const l=out[out.length-1];
          if(l[0]===q[0]&&l[1]===q[1])continue;
          out.push([q[0],q[1]]);added++;
        }
      }
      p.points=out;
    }
  };
  pass(targets);
  if(onlyId){
    /* соседей тоже надо разрезать под наши вершины */
    const me=provs.find(p=>p.id===onlyId);
    if(me){
      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      for(const q of me.points){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
      pass(provs.filter(q=>{
        if(q===me)return false;
        let a0=1e9,b0=1e9,a1=-1e9,b1=-1e9;
        for(const r of q.points){a0=Math.min(a0,r[0]);a1=Math.max(a1,r[0]);b0=Math.min(b0,r[1]);b1=Math.max(b1,r[1]);}
        return !(a1<x0-T||a0>x1+T||b1<y0-T||b0>y1+T);
      }));
    }
  } else pass(provs);
  bumpBorders();
  return {moved,added};
}
/* ---- прилипание вершин провинций к соседним (для склейки границ) ---- */
function snapVertex(x,y){
  if(!layers.snap) return [Math.round(x),Math.round(y)];
  const R=16/view.s; let best=null,bd=R;
  for(const p of data.provinces) for(const pt of p.points){
    const d=Math.hypot(pt[0]-x,pt[1]-y); if(d<bd){bd=d;best=pt;}
  }
  if(drawing) for(const pt of drawing){ const d=Math.hypot(pt[0]-x,pt[1]-y); if(d<bd){bd=d;best=pt;} }
  return best?[best[0],best[1]]:[Math.round(x),Math.round(y)];
}

function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}

function chev(d,Ud,h){

function roadLength(r){let L=0;for(let i=1;i<r.pts.length;i++)L+=Math.hypot(r.pts[i][0]-r.pts[i-1][0],r.pts[i][1]-r.pts[i-1][1]);return L;}
function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return [x/pts.length,y/pts.length];}

/* =============================================================
   ПРОВИНЦИИ: единая страна, тонкая пунктирная граница внутри
   Ребро считается внутренним, если по одну его сторону лежит
   другая провинция той же державы. Считается геометрически,
   поэтому точное совпадение координат не требуется.
   ============================================================= */
let borderVer=0, borderCache=null, _ncVer=-1, _ncAcc={};
function bumpBorders(){ borderVer++; borderCache=null; }
function ptIn(poly,x,y){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) c=!c;
  }
  return c;
}
/* 0 - свободное ребро (море, край карты), 1 - внутреннее (та же держава),
   2 - межгосударственная граница (по ту сторону чужая провинция) */
function borderFlags(){
  if(borderCache&&borderCache.v===borderVer) return borderCache.map;
  const provs=data.provinces.filter(p=>p.points.length>2);
  const bb=new Map();
  for(const p of provs)bb.set(p.id,bboxOf(p.points));
  const OFF=Math.max(2,(img.naturalWidth||4000)/1600);
  const map={};
  for(const p of provs){
    const n=p.points.length, flags=new Uint8Array(n), r=bb.get(p.id);
    const cand=provs.filter(q=>{
      if(q===p)return false;
      const s2=bb.get(q.id);
      return !(s2[2]<r[0]-OFF||s2[0]>r[2]+OFF||s2[3]<r[1]-OFF||s2[1]>r[3]+OFF);
    });
    if(cand.length)for(let i=0;i<n;i++){
      const a=p.points[i], b=p.points[(i+1)%n];
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
      if(!L)continue;
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, nx=-dy/L*OFF, ny=dx/L*OFF;
      let kind=0;
      for(const q of cand){
        const s2=bb.get(q.id); let hit=false;
        for(const pt of [[mx+nx,my+ny],[mx-nx,my-ny]]){
          if(pt[0]<s2[0]||pt[0]>s2[2]||pt[1]<s2[1]||pt[1]>s2[3])continue;
          if(ptIn(q.points,pt[0],pt[1])){hit=true;break;}
        }
        if(hit){
          if(p.nationId&&q.nationId===p.nationId){kind=1;break;}
          kind=2;
        }
      }
      flags[i]=kind;
    }
    map[p.id]=flags;
  }
  borderCache={v:borderVer,map};
  return map;
}
function renderProvinces(mode,hasUnder,U){
  const V=viewBox(), TOL=(quality.simplify?0.7:0.35)/view.s;
  const provs=data.provinces.filter(p=>canSee(p.vis,p.nationId)&&p.points.length>2&&boxHit(pbox(p),V));
  if(!provs.length) return "";
  const flags=borderFlags();
  const W=U*(hasUnder?0.4:0.26);          /* полная ширина внешней границы */
  let defs="", fills="", inner="", frontA="", frontB="", outer="", hit="";
  const shown=new Set();
  const showFill = !hasUnder && mode==="political";

  for(const p of provs){
    const wholeIn=boxInside(pbox(p),V);
    const light=simplify(p.points,TOL);
    const pts=light.map(pt=>pt.join(",")).join(" ");
    const col=p.nationId?(nation(p.nationId)?.color||"#8a8a8a"):"#9a9a9a";
    if(showFill&&p.nationId)
      fills+='<polygon points="'+pts+'" fill="'+col+'" fill-opacity="0.45" stroke="none"/>';
    hit+='<polygon data-kind="province" data-id="'+p.id+'" points="'+pts+'" fill="#000" fill-opacity="0.001" stroke="none" style="cursor:pointer"/>';

    /* рёбра одного типа сливаются в один путь; при любом пропуске текущая нить обрывается */
    const f=flags[p.id]||[], n=p.points.length;
    let dIn="", dFr="", dOut="", runIn=false, runFr=false, runOut=false;
    const cut=()=>{runIn=runFr=runOut=false;};
    for(let i=0;i<n;i++){
      const a=p.points[i], b=p.points[(i+1)%n];
      /* сегмент целиком за экраном не отдаётся браузеру вовсе */
      if(!wholeIn && !segIn(a,b,V)){cut();continue;}
      const k=f[i]|0;
      if(k===1){
        const key=Math.round((a[0]+b[0])/2)+','+Math.round((a[1]+b[1])/2);
        if(shown.has(key)){cut();continue;}       /* дубль стыка: нить рвём, а не тянем через карту */
        shown.add(key);
        if(!runIn){dIn+='M'+a[0]+' '+a[1];runIn=true;runFr=runOut=false;}
        dIn+='L'+b[0]+' '+b[1];
      } else if(k===2){
        if(!runFr){dFr+='M'+a[0]+' '+a[1];runFr=true;runIn=runOut=false;}
        dFr+='L'+b[0]+' '+b[1];
      } else {
        if(!runOut){dOut+='M'+a[0]+' '+a[1];runOut=true;runIn=runFr=false;}
        dOut+='L'+b[0]+' '+b[1];
      }
    }

    if(dIn) inner+='<path d="'+dIn+'" stroke="'+col+'" stroke-opacity="0.5" stroke-width="'+(U*0.07)+
      '" stroke-dasharray="'+(U*0.45)+' '+(U*0.55)+'" fill="none"/>';
    if(dOut) outer+='<path d="'+dOut+'" stroke="'+(p.nationId?col:"#c9c9c9")+
      '" stroke-opacity="0.95" stroke-width="'+W+'" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
    if(dFr){
      /* межгосударственная граница: тёмная подложка во всю ширину и половина
         своего цвета, обрезанная по собственной территории. Сосед кладёт свою
         половину со своей стороны - выходит одна линия из двух цветов. */
      const cid='cpf'+p.id;
      defs+='<clipPath id="'+cid+'"><polygon points="'+pts+'"/></clipPath>';
      frontA+='<path d="'+dFr+'" stroke="#0f1113" stroke-opacity="0.9" stroke-width="'+(W*1.12)+
        '" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>';
      frontB+='<path d="'+dFr+'" stroke="'+col+'" stroke-width="'+W+
        '" stroke-linecap="butt" stroke-linejoin="round" fill="none" clip-path="url(#'+cid+')"/>';
    }

  let sel="";
  if(selection?.kind==="province"){
    const p=data.provinces.find(x=>x.id===selection.id);
    if(p) sel='<polygon points="'+p.points.map(pt=>pt.join(",")).join(" ")+
      '" fill="none" stroke="#e8d9a8" stroke-width="'+(U*0.3)+'" stroke-linejoin="round" style="pointer-events:none"/>';
  }
  return (defs?'<defs>'+defs+'</defs>':'')+fills+hit+inner+frontA+frontB+outer+sel;
}

/* видимая область в координатах карты, с запасом */
function viewBox(){

  return [ -view.x/view.s-pad, -view.y/view.s-pad,
           (-view.x+r.width)/view.s+pad, (-view.y+r.height)/view.s+pad ];

function bboxOf(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const q of pts){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}

const boxHit=(b,v)=>!(b[2]<v[0]||b[0]>v[2]||b[3]<v[1]||b[1]>v[3]);
const boxInside=(b,v)=>b[0]>=v[0]&&b[2]<=v[2]&&b[1]>=v[1]&&b[3]<=v[3];
function segIn(a,b,v){
  if(Math.max(a[0],b[0])<v[0]||Math.min(a[0],b[0])>v[2])return false;
  if(Math.max(a[1],b[1])<v[1]||Math.min(a[1],b[1])>v[3])return false;

    const col=nation(s.nationId)?.color||"#999";
    const R=Us*2.3;
    out+=`<g data-kind="structure" data-id="${s.id}" style="cursor:${role?.gm?'move':'pointer'}">
      <circle cx="${s.x}" cy="${s.y}" r="${R}" fill="#1c1f26" stroke="${sel?'#e8d9a8':st[4]}" stroke-width="${Us*(sel?0.5:0.32)}"/>
      <circle cx="${s.x}" cy="${s.y}" r="${R*0.72}" fill="none" stroke="${col}" stroke-width="${Us*0.2}"/>
      <text x="${s.x}" y="${s.y+R*0.42}" font-size="${R*1.05}" text-anchor="middle" fill="${st[4]}" style="pointer-events:none">${st[2]}</text>
      ${lab?`<text x="${s.x}" y="${s.y+R+Us*2.2}" font-size="${Us*2}" text-anchor="middle" fill="${st[4]}" stroke="#111" stroke-width="${Us*0.22}" paint-order="stroke" style="pointer-events:none">${esc(s.name)}</text>`:""}
    </g>`;
  }

  const noLbl=new Set(data.meta.hideDivLabels||[]);
  /* при съёмке: части с пометкой «не в снимок» и чужие державы не рисуются */
  const shotSkip=(o)=> _shotOn && (o.noShot || (_shotNat && !_shotNat.has(o.nationId)));
  if(layers.divisions&&marks)for(const d of data.divisions){
    if(shotSkip(d))continue;
    if(!canSee(d.vis,d.nationId)||!inView(d.x,d.y,VB))continue;
    const sel=selection?.kind==="division"&&selection.id===d.id;
    const col=nation(d.nationId)?.color||"#888";
    const w=Ud*1.6,h=Ud*1.0;
    const sym=DIV_TYPES.find(t=>t[0]===d.type)?.[2]||"✕";
    const symFs=sym.length>1?h*0.5:h*0.7;
    out+=`<g data-kind="division" data-id="${d.id}" style="cursor:${canMoveDivision(d)?'move':'pointer'}">
      <rect x="${d.x-w/2}" y="${d.y-h/2}" width="${w}" height="${h}" fill="#1c1f26" stroke="${sel?'#e8d9a8':col}" stroke-width="${Ud*(sel?0.12:0.07)}"/>
      <text x="${d.x}" y="${d.y+symFs*0.35}" font-size="${symFs}" text-anchor="middle" fill="${col}" style="pointer-events:none">${sym}</text>
      ${chev(d,Ud,h)}
      ${(lab&&!noLbl.has(d.nationId))?`<text x="${d.x}" y="${d.y+h/2+Ud*0.62}" font-size="${Ud*0.55}" text-anchor="middle" fill="${col}" stroke="#111" stroke-width="${Ud*0.06}" paint-order="stroke" style="pointer-events:none">${esc(d.name)}</text>`:""}
    </g>`;
  }
  if(layers.arrows) out += renderArrows(U);

  /* ---- месторождения ---- */
  if(layers.deposits&&marks)for(const dp of data.deposits){
    if(_shotOn&&dp.noShot)continue;
    if(!canSee(dp.vis,dp.nationId)||!inView(dp.x,dp.y,VB))continue;
    const t=DEP_TYPES.find(t=>t[0]===dp.type)||DEP_TYPES[0];
    const k=(DEP_SIZES.find(z=>z[0]===dp.size)||DEP_SIZES[1])[2];
    const sel=selection?.kind==="deposit"&&selection.id===dp.id;
    const R=Up*1.5*k;
    out+=`<g data-kind="deposit" data-id="${dp.id}" style="cursor:${role?.gm?'move':'pointer'}">
      <rect x="${dp.x-R}" y="${dp.y-R}" width="${R*2}" height="${R*2}" transform="rotate(45 ${dp.x} ${dp.y})"
        fill="#14161a" stroke="${sel?'#e8d9a8':t[3]}" stroke-width="${Up*(sel?0.36:0.22)}"/>
      <text x="${dp.x}" y="${dp.y+R*0.38}" font-size="${R*1.05}" text-anchor="middle" fill="${t[3]}" style="pointer-events:none">${t[2]}</text>
      ${lab?`<text x="${dp.x}" y="${dp.y+R+Up*1.5}" font-size="${Up*1.35}" text-anchor="middle" fill="${t[3]}" stroke="#111" stroke-width="${Up*0.16}" paint-order="stroke" style="pointer-events:none">${esc(dp.name)}${dp.output?" · "+esc(dp.output):""}</text>`:""}
    </g>`;
  }

  /* ---- столица экономики: значок пула ресурсов, видят ГМ и владелец ---- */
  if(layers.borders&&marks&&!_shotOn)for(const n of data.nations){
    if(!canSeeNationEcon(n.id))continue;
    const p=econCap(n.id); if(!p)continue;
    const c=centroid(p.points); if(!inView(c[0],c[1],VB))continue;
    const R=Uc*0.62;
    out+=`<g data-kind="province" data-id="${p.id}" data-tip="Столица экономики «${esc(n.name)}»: здесь собран пул ресурсов государства" style="cursor:pointer">
      <rect x="${c[0]-R}" y="${c[1]-R}" width="${R*2}" height="${R*2}" transform="rotate(45 ${c[0]} ${c[1]})" fill="#14161a" stroke="#e0c068" stroke-width="${Uc*0.1}"/>
      <text x="${c[0]}" y="${c[1]+R*0.42}" font-size="${R*1.2}" text-anchor="middle" fill="#e0c068" style="pointer-events:none">◈</text></g>`;
  }
  /* ---- подписи стран поверх границ при отдалении ---- */
  if(CM){
    if(_ncVer!==borderVer){
      _ncAcc={};
      for(const p of data.provinces){
        if(!p.nationId||!canSee(p.vis,p.nationId)||p.points.length<3)continue;
        const a=polyArea(p.points), c=centroid(p.points);
        const o=_ncAcc[p.nationId]||(_ncAcc[p.nationId]={x:0,y:0,a:0});
        o.x+=c[0]*a; o.y+=c[1]*a; o.a+=a;
      }
      _ncVer=borderVer;
    }
    const acc=_ncAcc, F=15/view.s;
    for(const nid in acc){
      const o=acc[nid]; if(!o.a)continue;
      const n=nation(nid); if(!n)continue;
      out+=`<text x="${o.x/o.a}" y="${o.y/o.a}" font-size="${F}" text-anchor="middle" fill="${n.color}"
        fill-opacity="0.95" stroke="#0d0f12" stroke-opacity="0.75" stroke-width="${F/11}" paint-order="stroke"
        letter-spacing="${F*0.07}" style="pointer-events:none;font-family:Georgia,serif;text-transform:uppercase">${esc(n.name)}</text>`;
    }
  }
  svg.innerHTML=out;
}

function roadClass(c){ return ROAD_CLASSES.find(x=>x[0]===c)||ROAD_CLASSES[1]; }
function renderRoads(U){
  let out="";
  const S=(data.meta.iconScale?.road||100)/100;
  const draw=(pts,col,cls,sel,id)=>{
    const rc=roadClass(cls), W=Math.max(0.4,U*0.22*rc[2]*S);
    const d=pts.map((q,i)=>(i?"L":"M")+q[0]+" "+q[1]).join(" ");
    let dash="";
    if(rc[3]==="dash")dash=' stroke-dasharray="'+(W*4.5).toFixed(2)+' '+(W*2.8).toFixed(2)+'"';
    if(rc[3]==="dot") dash=' stroke-dasharray="'+(W*1.1).toFixed(2)+' '+(W*2.4).toFixed(2)+'"';
    let g='<g data-kind="road" data-id="'+(id||"")+'" style="cursor:pointer">';
    g+='<path d="'+d+'" fill="none" stroke="#0f1113" stroke-opacity="0.8" stroke-width="'+(W*2.5).toFixed(2)+
       '" stroke-linejoin="round" stroke-linecap="round"/>';
    g+='<path d="'+d+'" fill="none" stroke="'+(sel?"#e8d9a8":col)+'" stroke-width="'+W.toFixed(2)+
       '" stroke-linejoin="round" stroke-linecap="round"'+dash+'/>';
    return g+'</g>';
  };
  const V=viewBox();
  for(const r of (data.roads||[])){
    if(!canSee(r.vis,r.nationId))continue;
    if(r.pts.length<2||!boxHit(bboxOf(r.pts),V))continue;
    out+=draw(r.pts,r.color||ROAD_COLOR,r.cls,selection?.kind==="road"&&selection.id===r.id,r.id);
  }
  if(roadDraft&&roadDraft.length){
    const W=Math.max(0.4,U*0.22*S);
    const ext=window.__extend?.kind==="road"?data.roads.find(o=>o.id===window.__extend.id):null;
    if(roadDraft.length>1) out+=draw(roadDraft,"#c9a25a",(ext?.cls||"road"),true,"");
    for(const q of roadDraft) out+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(W*1.6).toFixed(2)+
      '" fill="#c9a25a" stroke="#0f1113" stroke-width="'+(W*0.4).toFixed(2)+'" style="pointer-events:none"/>';
  }
  return out;
}
